<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LifeOS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--s9);min-height:100vh}
input,select,textarea,button{font-family:'Inter',sans-serif}
input:focus,select:focus,textarea:focus{outline:none;border-color:#86ab5b!important}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--card)}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:4px}
#app{max-width:480px;margin:0 auto;padding-bottom:20px}
.header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-size:17px;font-weight:800;letter-spacing:-.5px}.logo span{color:#86ab5b}
.header-date{font-size:10px;color:var(--s4);margin-top:1px}
.header-badges{display:flex;gap:6px;align-items:center}
.badge{border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700}
.badge-fire{background:#f59e0b22;border:1px solid #f59e0b33;color:#f59e0b}
.badge-xp{background:#6a9a5522;border:1px solid #6a9a5533;color:#b9d190;text-align:center}
.badge-xp .lv{font-size:9px;color:#6a9a55;font-weight:700;line-height:1}
.badge-xp .xp{font-size:11px;font-weight:800}
.badge-focus{background:#6a9a5522;border:1px solid #6a9a5533;color:#b9d190;cursor:pointer;border:none;border-radius:8px}
.tabs-bar{display:flex;gap:3px}
.tab-btn{flex:1;padding:7px 2px;border-radius:8px;border:none;cursor:pointer;background:transparent;color:var(--s4);font-size:9px;font-weight:700;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab-btn .ico{font-size:15px}
.tab-btn.active{background:#86ab5b;color:#132318}
.content{padding:16px}
.page-title{font-size:19px;font-weight:800;margin-bottom:14px;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 6px 20px #1f3a2614}
.card.purple{background:linear-gradient(135deg,#6a9a550a,var(--card));border-color:#6a9a5522}
.card.teal{background:linear-gradient(135deg,#86ab5b0e,var(--card))}
.card.red{background:linear-gradient(135deg,#ef44440a,var(--card));border-color:#ef444422}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.bar-wrap{background:var(--bd);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .5s ease}
.inp{background:var(--bd);border:1px solid var(--bd2);border-radius:8px;color:var(--s9);padding:10px 12px;font-size:13px;width:100%}
.inp::placeholder{color:var(--s4)}
textarea.inp{resize:none;line-height:1.6}
select.inp{appearance:none;cursor:pointer}
.btn{background:#86ab5b;color:#132318;border:none;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;width:100%;transition:opacity .2s}
.btn:hover{opacity:.88}
.btn.purple{background:#6a9a55;color:#fff}
.btn.red{background:#ef4444;color:#fff}
.btn.amber{background:#f59e0b;color:#132318}
.btn.sm{background:transparent;border:1px solid var(--bd);color:var(--s5);border-radius:7px;padding:6px 10px;font-size:12px;width:auto}
.btn.danger{background:transparent;border:1px solid #ef444433;color:#ef4444;font-size:12px;font-weight:600}
.label{font-size:11px;color:var(--s5);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.sublabel{font-size:12px;color:var(--s5);margin-bottom:6px}
.cat-dot{width:3px;height:16px;border-radius:2px;flex-shrink:0}
.habit-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;transition:all .2s;cursor:pointer}
.habit-item.done{border-color:#86ab5b44;background:#86ab5b08}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--s3);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;cursor:pointer}
.check.done{background:#86ab5b;border-color:#86ab5b}
.check.done::after{content:'✓';font-size:13px;color:#132318;font-weight:900}
.habit-name{font-size:14px;font-weight:600;color:var(--s8);transition:all .2s}
.habit-name.done{color:#86ab5b;text-decoration:line-through}
.habit-id{font-size:11px;color:var(--s4);margin-top:2px}
.xp-tag{font-size:11px;color:#86ab5b;font-weight:700;margin-left:auto;white-space:nowrap}
.ring-wrap{position:relative;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.ring-pct{font-size:13px;font-weight:700;color:var(--s9)}
.modal-bg{position:fixed;inset:0;background:#000000bb;z-index:999;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--card);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:700;color:var(--s9)}
.modal-close{background:var(--bd);border:none;color:var(--s6);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px}
.form-row{margin-bottom:12px}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.emoji-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.emoji-btn{font-size:20px;background:transparent;border:1.5px solid var(--bd);border-radius:8px;padding:5px 8px;cursor:pointer;transition:all .2s}
.emoji-btn.sel{background:#86ab5b22;border-color:#86ab5b}
.modal-actions{display:flex;gap:8px;margin-top:4px}
#onboarding{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.ob-wrap{width:100%;max-width:420px}
.ob-logo{text-align:center;margin-bottom:24px;font-size:22px;font-weight:800}
.ob-progress{display:flex;gap:6px;margin-bottom:24px}
.ob-bar{flex:1;height:3px;border-radius:99px;background:var(--bd);transition:background .3s}
.ob-bar.active{background:#86ab5b}
.ob-step{display:none}.ob-step.active{display:block}
.ob-emoji{font-size:52px;text-align:center;margin-bottom:16px}
.ob-h{font-size:23px;font-weight:800;color:var(--s9);margin-bottom:8px}
.ob-p{color:var(--s5);font-size:14px;line-height:1.6;margin-bottom:16px}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.goal-btn{background:var(--bd);border:1.5px solid var(--bd2);border-radius:10px;padding:12px 10px;cursor:pointer;text-align:left;color:var(--s6);font-size:13px;font-weight:600;transition:all .2s}
.goal-btn .ge{font-size:18px;display:block;margin-bottom:4px}
.goal-btn.sel{background:#86ab5b22;border-color:#86ab5b;color:#86ab5b}
#focus-mode{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.focus-close{position:absolute;top:20px;right:20px;background:var(--bd);border:none;color:var(--s5);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:18px}
.focus-label{font-size:13px;color:var(--s5);margin-bottom:8px;text-transform:uppercase;letter-spacing:2px}
.focus-ring{position:relative;margin-bottom:24px}
.focus-ring svg{transform:rotate(-90deg)}
.focus-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:var(--s9);letter-spacing:-2px}
.focus-btns{display:flex;gap:10px;margin-bottom:20px}
.focus-presets{display:flex;gap:8px}
.humor-row{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.humor-btn{font-size:28px;background:none;border:2px solid transparent;border-radius:10px;padding:6px;cursor:pointer;transition:border .2s}
.humor-btn.sel{border-color:#86ab5b}
.entry-preview{font-size:12px;color:var(--s4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.entry-body{font-size:13px;color:var(--s6);line-height:1.7;border-top:1px solid var(--bd);padding-top:12px;margin-top:8px}
.sub-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.sub-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--s3);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s}
.sub-check.done{border-color:#86ab5b;background:#86ab5b}
.sub-check.done::after{content:'✓';font-size:10px;color:#132318;font-weight:900}
.sub-text{flex:1;font-size:13px;color:var(--s7)}
.sub-text.done{color:var(--s5);text-decoration:line-through}
.del-btn{background:none;border:none;color:var(--s4);cursor:pointer;font-size:15px;padding:2px 4px}
.cat-badge{border-radius:5px;padding:2px 7px;font-size:10px;font-weight:700;display:inline-block}
.section-cat{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.section-cat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
.empty-state{text-align:center;padding:40px 20px;color:var(--s4)}
.empty-state .es-ico{font-size:48px;margin-bottom:12px}
.empty-state .es-t{font-size:15px;color:var(--s5)}
.empty-state .es-s{font-size:13px;color:var(--s4);margin-top:4px}
/* ─── FINANZAS específico ─── */
.fin-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.fin-tab{padding:7px 14px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--s5);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.fin-tab.active{background:#86ab5b22;border-color:#86ab5b;color:#86ab5b}
.tx-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.tx-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-name{font-size:13px;font-weight:600;color:var(--s8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--s4);margin-top:1px}
.tx-amount{font-size:14px;font-weight:700;white-space:nowrap}
.tx-amount.ingreso{color:#86ab5b}
.tx-amount.gasto{color:#ef4444}
.deuda-item{padding:14px 0;border-bottom:1px solid var(--bd)}
.deuda-name{font-size:14px;font-weight:600;color:var(--s9);margin-bottom:4px}
.pill{display:inline-block;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:700}
.pill-red{background:#ef444422;color:#ef4444}
.pill-amber{background:#f59e0b22;color:#f59e0b}
.pill-green{background:#86ab5b22;color:#86ab5b}
.tipo-sel{display:flex;gap:6px;margin-bottom:12px}
.tipo-btn{flex:1;padding:9px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--s5);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.tipo-btn.sel-ingreso{background:#86ab5b22;border-color:#86ab5b;color:#86ab5b}
.tipo-btn.sel-gasto{background:#ef444422;border-color:#ef4444;color:#ef4444}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.week-nav button{background:var(--bd);border:none;color:var(--s6);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.week-nav span{font-size:13px;font-weight:600;color:var(--s9)}
/* misc */
.hidden{display:none!important}
.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}
.flex-center{display:flex;align-items:center}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
.mt4{margin-top:4px}.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt14{margin-top:14px}.mt16{margin-top:16px}
.mb4{margin-bottom:4px}.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}.mb16{margin-bottom:16px}
.f10{font-size:10px}.f11{font-size:11px}.f12{font-size:12px}.f13{font-size:13px}.f14{font-size:14px}.f15{font-size:15px}.f20{font-size:20px}.f22{font-size:22px}.f30{font-size:30px}
.fw7{font-weight:700}.fw8{font-weight:800}
.c-teal{color:#86ab5b}.c-purple{color:#6a9a55}.c-amber{color:#f59e0b}.c-cyan{color:#6fb3a0}.c-pink{color:#d98a7a}.c-muted{color:var(--s5)}.c-dim{color:var(--s4)}.c-main{color:var(--s9)}.c-sub{color:var(--s6)}.c-mid{color:var(--s7)}.c-red{color:#ef4444}
.text-center{text-align:center}.w100{width:100%}.italic{font-style:italic}
.ls1{letter-spacing:1px}.ls15{letter-spacing:1.5px}

.tabs-bar{display:none!important}
#app{padding-bottom:110px!important}
.card.dark,.dk{background:linear-gradient(160deg,#24422c,#183220);color:#eef3e2;border-color:#2f5238}
.dk{border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:0 8px 22px #1f3a2633}
.wk{display:flex;justify-content:space-between;margin-top:14px}
.wk div{text-align:center;font-size:10px;color:#b7c9a8}
.wk i{display:block;width:22px;height:22px;border-radius:50%;margin-top:5px;border:1.5px solid #5d7a5a}
.wk i.on{background:#9cc46a;border-color:#9cc46a}
.mx{display:grid;grid-template-columns:1fr repeat(7,18px) 30px;gap:5px;align-items:center;margin-top:9px;font-size:12px}
.mx b{width:18px;height:18px;border-radius:50%;background:var(--bd)}
.mx b.on{background:#86ab5b}
.mx .hd{font-size:9px;color:var(--s5);text-align:center}
.chart{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:12px}
.chart div{flex:1;text-align:center;font-size:10px;color:#b7c9a8;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart span{display:block;background:#6a9a55;border-radius:8px 8px 4px 4px;margin-bottom:5px;transition:height .6s}
.chart .best span{background:#b5d98a}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(452px,calc(100% - 24px));height:66px;background:var(--card);border-radius:34px;display:flex;align-items:center;justify-content:space-around;box-shadow:0 10px 30px #0a1a0f40;border:1px solid var(--bd);z-index:200}
.nav button{background:none;border:none;color:var(--s5);width:52px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:700;cursor:pointer;transition:all .35s cubic-bezier(.3,1.6,.5,1);position:relative}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.nav button.on{color:var(--s9)}
.nav button.on svg{transform:translateY(-3px) scale(1.12)}
.nav button.on::after{content:'';position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:#86ab5b}
.nav .fab{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#a9cf78,#5f8f45);color:#fff;margin-top:-34px;border:6px solid var(--bg);box-shadow:0 8px 20px #5f8f4566;animation:pulse 2.8s infinite}
.nav .fab svg{width:26px;height:26px;stroke-width:2.4}
.nav .fab.open svg{transform:rotate(45deg)}
@keyframes pulse{0%,100%{box-shadow:0 8px 20px #5f8f4566,0 0 0 0 #86ab5b55}50%{box-shadow:0 8px 20px #5f8f4566,0 0 0 10px #86ab5b00}}
.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:92px;width:min(452px,calc(100% - 24px));background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:190;opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 12px 34px #0a1a0f40}
.sheet.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.sheet button{background:var(--bd);border:none;border-radius:16px;padding:14px 8px;color:var(--s9);font-size:12px;font-weight:700;cursor:pointer}
.sheet button span{display:block;font-size:20px;margin-bottom:4px}
.ic{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex-shrink:0}.ie{display:contents}
.mx{grid-template-columns:minmax(0,1fr) repeat(7,24px) 26px!important;gap:3px!important}
.mx.hd{margin-top:12px}.mx.hd div{font-size:10px;color:var(--s5);text-align:center;line-height:1.2;font-weight:600}.mx.hd small{display:block;font-size:9px;font-weight:400}.mx.hd .t{color:#86ab5b;font-weight:800}
.hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-size:12px}
.dc{width:24px;height:24px;border-radius:50%;border:none;background:var(--bd);cursor:pointer;padding:0;transition:transform .15s,background .2s}
.dc:active{transform:scale(.8)}.dc.on{background:#86ab5b;box-shadow:inset 0 0 0 6px #86ab5b}.dc.on::after{content:'✓';color:#fff;font-size:12px;font-weight:800}.dc:disabled{opacity:.35;cursor:default}
.frase{background:var(--bd);border-radius:22px;padding:16px 46px 16px 18px;position:relative;margin-bottom:12px}.frase .fi{position:absolute;right:16px;top:14px;font-size:24px;color:#86ab5b}
.fq{font-size:14px;line-height:1.5;font-weight:600}.fa{font-size:11px;color:#86ab5b;margin-top:6px}
.seg{display:flex;background:var(--bd);border-radius:16px;padding:3px;gap:2px;margin-bottom:14px}.seg button{flex:1;border:none;background:transparent;color:var(--s5);padding:9px 2px;border-radius:13px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}.seg button.on{background:var(--card);color:var(--s9);box-shadow:0 2px 8px #0002}.seg.sm{width:60%}
.wv{animation:wv 2.6s linear infinite}@keyframes wv{to{transform:translateX(-60px)}}
</style>
<style>
.mn-day{padding:12px 14px}.mn-day-t{font-size:14px;font-weight:800;color:#86ab5b;margin-bottom:6px}
.mn-row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.mn-l{width:66px;flex-shrink:0;font-size:11px;font-weight:600;color:var(--s5);padding-top:2px}
.mn-n{font-size:13px;font-weight:600;color:var(--s8)}.mn-row.snack .mn-n{font-weight:500;color:var(--s6)}
.mn-d{font-size:11px;color:var(--s5);line-height:1.5;margin-top:2px}
.mn-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer;font-size:13px;color:var(--s7)}
.mn-item .check{width:20px;height:20px;border-radius:6px}.mn-add{display:flex;gap:8px;margin-top:10px}.mn-add .inp{padding:8px 10px}.mn-add .btn.sm{padding:6px 14px;font-size:16px}
.mn-item.done span{color:var(--s4);text-decoration:line-through}
</style>
<style>
.cs-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;cursor:pointer;transition:border-color .2s}
.cs-btn:hover,.cs-btn:focus-visible{border-color:#86ab5b;outline:none}
.cs-bg{position:fixed;inset:0;background:#000000aa;z-index:1200;display:flex;align-items:flex-end;justify-content:center;animation:csFade .18s ease}
.cs-box{background:var(--card);border:1px solid var(--bd);border-bottom:none;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:70vh;padding:8px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;animation:csUp .22s ease}
.cs-grab{width:38px;height:4px;border-radius:4px;background:var(--s3);margin:4px auto 12px}
.cs-title{font-size:13px;font-weight:700;color:var(--s6);margin:0 6px 10px}
.cs-list{overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.cs-opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--s7);font-size:15px;font-weight:500;text-align:left;cursor:pointer;transition:background .15s}
.cs-opt:hover{background:var(--bd)}
.cs-opt.sel{background:#86ab5b14;border-color:#86ab5b55;color:#86ab5b;font-weight:700}
.cs-opt i{width:20px;height:20px;border-radius:50%;border:2px solid var(--s3);flex-shrink:0;position:relative}
.cs-opt.sel i{background:#86ab5b;border-color:#86ab5b}
.cs-opt.sel i::after{content:'';position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #132318;border-width:0 2px 2px 0;transform:rotate(45deg)}
@keyframes csUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes csFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.cs-bg,.cs-box{animation:none}}
</style>

</style>
<style>
.agua{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.vaso{padding:8px 0;border-radius:8px;border:1px solid var(--bd);background:transparent;font-size:16px;opacity:.3;cursor:pointer;transition:all .15s}
.vaso.on{opacity:1;background:#6fb3a022;border-color:#6fb3a055}
.pr-inp{width:100px;padding:6px 8px;font-size:12px;text-align:right}

<style>
:root{--bg:#101b13;--card:#182a1d;--bd:#243a29;--bd2:#31503a;--s3:#3d5a44;--s4:#6f8a74;--s5:#8fa793;--s6:#aabfad;--s7:#c8d6c4;--s8:#e2eadb;--s9:#f3f5ea;color-scheme:dark}

<script>
// ══ STATE ══════════════════════════════════════════════════════════════════
const KEY='lifeos_';
function ls(k,d){try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch{}}

let state={
  user: ls('user',null),
  habitos: ls('habitos',[]),
  metas: ls('metas',[]),
  comp: ls('comp',{}),
  diario: ls('diario',[]),
  menu: ls('menu',{sem:1,vista:'menu',chk:{}}),
  agua: ls('agua',{}),
  presup: ls('presup',{}),
  hist: ls('hist',{}),
  eventos: ls('eventos',[]),
  // FINANZAS
  txs: ls('txs',[]),        // transacciones: {id,fecha,tipo,categoria,cuenta,monto,nota}
  deudas: ls('deudas',[]),  // {id,nombre,prestamista,monto,pagado,deadline,tipo}
  ingresos: ls('ingresos',[]), // {id,fecha,tipo,monto,cuenta,nota}  tipo=sueldo|bono|otro
};
function save(k){lsSet(k,state[k]);}
function nid(a){return a.length?Math.max(...a.map(x=>x.id))+1:1;}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return ymd(new Date());}
function fmt(n){return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});}

const CATS_H=['Salud','Mente','Trabajo','Relaciones','Dinero','Crecimiento'];
const CCAT={Salud:'#86ab5b',Mente:'#a3b18a',Trabajo:'#6a9a55',Relaciones:'#d98a7a',Dinero:'#6fb3a0',Crecimiento:'#f59e0b'};
const EMOJIS_H=['✅','🏃','📚','💧','🧘','💪','🥗','😴','📝','🎯','🎸','💰','❤️','🧠','✍️'];
const EMOJIS_M=['🎯','🏃','📚','💰','❤️','🧠','✈️','💻','🎸','🏠','🌍','🎓','💪','🧘','🎨'];
const HUMORES=['😣','😔','😐','😊','🤩'];

// ─── FINANZAS CONSTANTES ────────────────────────────────────────────────────
const CUENTAS=['TDC Nu','TDC Didi','Débito Nu','Débito Bakaool','Mercado Pago Crédito','Banorte','Efectivo'];
const CATS_TX=['Supermercado/Despensa','Gasolina/Transporte','Entretenimiento/Salidas','Restaurantes/Comida','Suscripciones','Servicios/Hogar','Ropa/Compras','Salud/Farmacia','Pago Préstamo','Otro'];
const PRESTAMOS=['Nu Préstamo','Didi Préstamo','Nu TDC','Mercado Pago Crédito','Didi TDC'];
const CAT_TX_COLOR={'Supermercado/Despensa':'#86ab5b','Gasolina/Transporte':'#f59e0b','Entretenimiento/Salidas':'#a3b18a','Restaurantes/Comida':'#d98a7a','Suscripciones':'#6a9a55','Servicios/Hogar':'#6fb3a0','Ropa/Compras':'#f97316','Salud/Farmacia':'#10b981','Pago Préstamo':'#ef4444','Otro':'var(--s5)'};
const CAT_TX_EMO={'Supermercado/Despensa':'🛒','Gasolina/Transporte':'⛽','Entretenimiento/Salidas':'🎉','Restaurantes/Comida':'🍽️','Suscripciones':'📱','Servicios/Hogar':'🏠','Ropa/Compras':'👕','Salud/Farmacia':'💊','Pago Préstamo':'💸','Otro':'📦'};

// estado UI finanzas
let finPer='semana', finTab='resumen', weekOffset=0, finTipo='gasto';

// ══ HELPERS UI ══════════════════════════════════════════════════════════════
function bar(pct,color='#86ab5b',h=6){
  pct=Math.max(0,Math.min(100,pct));
  return `<div class="bar-wrap" style="height:${h}px"><div class="bar-fill" style="width:${pct}%;background:${color};height:${h}px"></div></div>`;
}
function ring(pct,size=72,sw=6,color='#86ab5b'){
  const r=(size-sw*2)/2,c=2*Math.PI*r,d=(pct/100)*c;
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bd)" stroke-width="${sw}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
        stroke-dasharray="${d} ${c}" stroke-linecap="round"/>
    </svg>
    <div class="ring-label"><span class="ring-pct">${pct}%</span></div>
  </div>`;
}
function catBadge(cat){const col=CCAT[cat]||'var(--s6)';return `<span class="cat-badge" style="background:${col}22;color:${col};border:1px solid ${col}44">${cat}</span>`;}

// ══ RACHA ══════════════════════════════════════════════════════════════════
function calcRacha(){
  if(!state.habitos.length)return 0;
  let r=0,d=new Date();d.setDate(d.getDate()-1);
  while(true){const dia=ymd(d);if(state.habitos.some(h=>state.comp[h.id]===dia)){r++;d.setDate(d.getDate()-1);}else break;}
  if(state.habitos.some(h=>state.comp[h.id]===today()))r++;
  return r;
}

// ══ HEADER ══════════════════════════════════════════════════════════════════
function setTheme(t){document.documentElement.dataset.theme=t;lsSet('theme',t);const b=document.getElementById('theme-btn');if(b)b.textContent=t==='dark'?'☀️':'🌙';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0b1120':'#f3f5f9';}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');}
function updateHeader(){
  setTheme(document.documentElement.dataset.theme||'dark');
  const racha=calcRacha();
  document.getElementById('hdr-racha').textContent=racha;
  document.getElementById('hdr-date').textContent=new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
}

// ══ TABS ═══════════════════════════════════════════════════════════════════
let curTab='inicio';
function showTab(tab,btn){
  document.getElementById('page-'+curTab).classList.add('hidden');
  document.getElementById('page-'+tab).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');curTab=tab;renderTab(tab);
}
function renderTab(tab){
  if(tab==='inicio')renderInicio();
  else if(tab==='habitos')renderHabitos();
  else if(tab==='metas')renderMetas();
  else if(tab==='dinero')renderDinero();
  else if(tab==='diario')renderDiario();
  else if(tab==='menu')renderMenu();
  else if(tab==='agenda')renderAgenda();
}

// ══ INICIO ══════════════════════════════════════════════════════════════════
function renderInicio(){
  const{habitos,metas,comp,diario,user,txs,ingresos}=state;
  const td=today(),racha=calcRacha();
  const hComp=habitos.filter(h=>comp[h.id]===td).length;
  const hPct=habitos.length?Math.round(hComp/habitos.length*100):0;
  const mComp=metas.filter(m=>m.submetas.length&&m.submetas.every(s=>s.completado)).length;
  const mPct=metas.length?Math.round(mComp/metas.length*100):0;
  // finanzas este mes
  const mes=td.slice(0,7);
  const gastosMes=txs.filter(t=>t.tipo==='gasto'&&t.fecha.startsWith(mes)).reduce((s,t)=>s+t.monto,0);
  const ingresosMes=ingresos.filter(i=>i.fecha.startsWith(mes)).reduce((s,i)=>s+i.monto,0);
  const balance=ingresosMes-gastosMes;
  const catData=CATS_H.filter(c=>habitos.some(h=>h.categoria===c)).map(cat=>{
    const d=habitos.filter(h=>h.categoria===cat);
    return{cat,pct:d.length?Math.round(d.filter(h=>comp[h.id]===td).length/d.length*100):0};
  });
  let html=`<div class="page-title">Dashboard</div>`;
  if(user)html+=`<div class="card purple mb12"><div class="label ls15 c-purple mb4">Hola de nuevo</div><div class="f22 fw8 c-main mb6">${user.name} 👋</div>${user.vision?`<div class="f12 c-muted italic" style="line-height:1.6">"${user.vision}"</div>`:''}</div>`;
  html+=`<div class="grid2">
    <div class="card"><div class="f20 mb4">✅</div><div class="f20 fw8 c-teal">${hComp}/${habitos.length}</div><div class="f11 c-muted mb8">Hábitos hoy</div>${bar(hPct,'#86ab5b',4)}</div>
    <div class="card"><div class="f20 mb4">🎯</div><div class="f20 fw8 c-purple">${mComp}/${metas.length}</div><div class="f11 c-muted mb8">Metas logradas</div>${bar(mPct,'#6a9a55',4)}</div>
    <div class="card"><div class="f20 mb4">💸</div><div class="f20 fw8 c-red">${fmt(gastosMes)}</div><div class="f11 c-muted">Gastos este mes</div></div>
    <div class="card"><div class="f20 mb4">${balance>=0?'📈':'📉'}</div><div class="f20 fw8" style="color:${balance>=0?'#86ab5b':'#ef4444'}">${fmt(balance)}</div><div class="f11 c-muted">Balance del mes</div></div>
  </div>`;
  html+=proximosCard();
  html+=extrasInicio();
  if(catData.length){
    html+=`<div class="card mb12"><div class="label mb12">Rendimiento por área</div>

// ─── RESUMEN ─────────────────────────────────────────────────────────────────
function renderFinResumen(){
  const mes=today().slice(0,7);
  const txsMes=state.txs.filter(t=>t.fecha.startsWith(mes)&&t.tipo==='gasto');
  const ingMes=state.ingresos.filter(i=>i.fecha.startsWith(mes));
  const totalGasto=txsMes.reduce((s,t)=>s+t.monto,0);
  const totalIng=ingMes.reduce((s,i)=>s+i.monto,0);
  const balance=totalIng-totalGasto;
  const deudaTotal=state.deudas.reduce((s,d)=>s+(d.monto-d.pagado),0);

  // por categoría
  const porCat={};
  txsMes.forEach(t=>{porCat[t.categoria]=(porCat[t.categoria]||0)+t.monto;});
  const catArr=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);

  // por cuenta
  const porCuenta={};
  txsMes.forEach(t=>{porCuenta[t.cuenta]=(porCuenta[t.cuenta]||0)+t.monto;});

  let html=`
  <div class="grid2">
    <div class="card teal"><div class="label">Ingresos mes</div><div class="f22 fw8 c-teal">${fmt(totalIng)}</div></div>
    <div class="card red"><div class="label">Gastos mes</div><div class="f22 fw8 c-red">${fmt(totalGasto)}</div></div>
  </div>
  <div class="card mb12">
    <div class="label mb4">Balance del mes</div>
    <div class="f22 fw8" style="color:${balance>=0?'#86ab5b':'#ef4444'}">${fmt(balance)}</div>
    <div class="f11 c-muted mt4">${balance>=0?'✅ Estás gastando menos de lo que ganas':'⚠️ Gastas más de lo que ingresas'}</div>
    ${totalIng>0?bar(Math.min(100,Math.round(totalGasto/totalIng*100)),balance>=0?'#86ab5b':'#ef4444',8):''}
  </div>
  ${deudaTotal>0?`<div class="card red mb12"><div class="flex-between"><div><div class="label c-red">Deuda pendiente</div><div class="f22 fw8 c-red">${fmt(deudaTotal)}</div></div><div class="f30">💸</div></div></div>`:''}
  
  <div class="card mb12">
    <div class="flex-between mb12"><span class="label">Gastos por categoría</span><span class="f11 c-muted">${new Date().toLocaleString('es',{month:'long'})}</span></div>
    ${catArr.length===0?'<div class="f13 c-muted text-center" style="padding:16px">Sin gastos este mes</div>':''}
    ${catArr.map(([cat,monto])=>{
      const pct=totalGasto?Math.round(monto/totalGasto*100):0;
      const col=CAT_TX_COLOR[cat]||'var(--s5)';
      return `<div class="mb10">
        <div class="flex-between mb4">
          <span class="f13 c-mid">${CAT_TX_EMO[cat]||'📦'} ${cat}</span>
          <span class="f12 fw7" style="color:${col}">${fmt(monto)} <span class="c-muted f11">(${pct}%)</span></span>
        </div>${bar(pct,col,5)}
      </div>`;
    }).join('')}
  </div>

  <div class="card mb12">
    <div class="label mb12">Por tarjeta / cuenta</div>
    ${Object.entries(porCuenta).sort((a,b)=>b[1]-a[1]).map(([cuenta,monto])=>`
      <div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--bd)">
        <span class="f13 c-mid">💳 ${cuenta}</span>
        <span class="f13 fw7 c-red">${fmt(monto)}</span>
      </div>`).join('') || '<div class="f13 c-muted text-center" style="padding:12px">Sin datos</div>'}
  </div>

  ${presupCard()}`;
  return html;
}

// ─── SEMANA ───────────────────────────────────────────────────────────────────
function getWeekRange(offset){
  const now=new Date();
  const day=now.getDay()||7;
  const mon=new Date(now);mon.setDate(now.getDate()-day+1+offset*7);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return{start:ymd(mon),end:ymd(sun),mon,sun};
}
function renderFinSemana(){
  const{start,end,mon,sun}=getWeekRange(weekOffset);
  const txsSem=state.txs.filter(t=>t.fecha>=start&&t.fecha<=end);
  const ingSem=state.ingresos.filter(i=>i.fecha>=start&&i.fecha<=end);
  const totalG=txsSem.filter(t=>t.tipo==='gasto').reduce((s,t)=>s+t.monto,0);
  const totalI=ingSem.reduce((s,i)=>s+i.monto,0);
  const label=weekOffset===0?'Esta semana':weekOffset===-1?'Semana pasada':`${mon.toLocaleDateString('es',{day:'numeric',month:'short'})} – ${sun.toLocaleDateString('es',{day:'numeric',month:'short'})}`;
  // agrupar por día
  const porDia={};
  txsSem.filter(t=>t.tipo==='gasto').forEach(t=>{porDia[t.fecha]=(porDia[t.fecha]||0)+t.monto;});
  const all=[...txsSem,...ingSem].sort((a,b)=>b.fecha.localeCompare(a.fecha));

  let html=`
  <div class="week-nav">
    <button onclick="weekOffset--;renderDinero()">‹</button>
    <span>${label}</span>
    <button onclick="weekOffset++;renderDinero()" ${weekOffset>=0?'disabled style="opacity:.3"':''}>›</button>
  </div>
  <div class="grid2 mb12">
    <div class="card teal"><div class="label">Ingresos</div><div class="f20 fw8 c-teal">${fmt(totalI)}</div></div>
    <div class="card red"><div class="label">Gastos</div><div class="f20 fw8 c-red">${fmt(totalG)}</div></div>
  </div>`;

  // Totales por día de la semana
  const dias=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const maxDia=Math.max(...Object.values(porDia),1);
  html+=`<div class="card mb12"><div class="label mb10">Gastos por día</div><div style="display:flex;align-items:flex-end;gap:6px;height:60px">`;
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const key=ymd(d);
    const monto=porDia[key]||0;
    const h=monto?Math.max(4,Math.round(monto/maxDia*50)):2;
    const isToday=key===today();
    html+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="width:100%;background:${isToday?'#86ab5b':'#6a9a55'};height:${h}px;border-radius:4px 4px 0 0;opacity:${monto?1:.2}"></div>
      <div class="f10" style="color:${isToday?'#86ab5b':'var(--s5)'}">${dias[i]}</div>
    </div>`;
  }
  html+=`</div></div>`;

  html+=`<div class="card mb12"><div class="label mb10">Movimientos</div>`;
  if(!all.length)html+=`<div class="f13 c-muted text-center" style="padding:16px">Sin movimientos esta semana</div>`;
  all.forEach(t=>{
    const esIngreso=!!t.tipo&&t.tipo!=='gasto';
    const cat=t.categoria||t.tipo_ingreso||'Ingreso';
    const col=esIngreso?'#86ab5b':'#ef4444';
    const emo=esIngreso?'💵':(CAT_TX_EMO[cat]||'📦');
    html+=`<div class="tx-item">
      <div class="tx-ico" style="background:${(CAT_TX_COLOR[cat]||'var(--s5)')}22">${emo}</div>
      <div class="tx-info">
        <div class="tx-name">${t.nota||cat}</div>
        <div class="tx-meta">${t.cuenta||''} · ${new Date(t.fecha+'T12:00:00').toLocaleDateString('es',{weekday:'short',day:'numeric'})}</div>
      </div>
      <div>
        <div class="tx-amount ${esIngreso?'ingreso':'gasto'}">${esIngreso?'+':'-'}${fmt(t.monto)}</div>
        <button class="del-btn" onclick="${esIngreso?`deleteIngreso(${t.id})`:`deleteTx(${t.id})`}" style="float:right;color:var(--s4)">×</button>
      </div>
    </div>`;
  });
  html+=`</div>
  <button class="btn" onclick="openNuevaTx()" style="padding:12px;font-size:13px;border-radius:12px;margin-bottom:8px">+ Gasto</button>
  <button class="btn purple" onclick="openNuevoIngreso()" style="padding:11px;font-size:13px;border-radius:12px">+ Ingreso</button>`;
  return html;
}

function renderFinDeudas(){

          <div class="f14 fw7 c-main">${d.nombre}</div>

function abonarDeuda(id){
  const inp=document.getElementById('pago-'+id);

  save('deudas');if(inp)inp.value='';renderDinero();
}

function saveDeuda(id){

let expandedEntry=null,diarioHumor=3,diarioFoto=null,diarioDraft='';
function escH(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function keepDraft(){const t=document.getElementById('diario-txt');if(t)diarioDraft=t.value;}
function renderDiario(){
  const{diario}=state;
  let html=`<div class="page-title">Diario Personal</div>
  <div class="card mb14">
    <div class="sublabel">¿Cómo te sientes hoy?</div>
    <div class="humor-row">${HUMORES.map((h,i)=>`<button class="humor-btn${diarioHumor===i+1?' sel':''}" onclick="setHumor(${i+1})">${h}</button>`).join('')}</div>
    <textarea class="inp mb10" id="diario-txt" rows="4" placeholder="¿Qué pasó hoy? ¿Qué aprendiste? ¿Qué agradeces?...">${escH(diarioDraft)}</textarea>
    ${diarioFoto?`<div class="dia-prev mb10"><img src="${diarioFoto}" alt="Foto del día"/><button class="dia-x" onclick="quitarFoto()" aria-label="Quitar foto">×</button></div>`:`<div class="flex gap8 mb10"><label class="btn sm dia-add">📷 Tomar foto<input type="file" accept="image/*" capture="environment" onchange="pickFoto(this)" hidden/></label><label class="btn sm dia-add">🖼️ Galería<input type="file" accept="image/*" onchange="pickFoto(this)" hidden/></label></div>`}
    <button class="btn" onclick="guardarEntrada()">Guardar entrada</button>
  </div>`;
  if(!diario.length)html+=`<div class="empty-state"><div class="es-ico">📓</div><div class="es-t">Tu diario está vacío.</div></div>`;
  diario.forEach(e=>{
    const exp=expandedEntry===e.id;
    html+=`<div class="card mb10" onclick="toggleEntry(${e.id})" style="cursor:pointer">
      <div class="flex-between">
        <div class="flex gap8" style="align-items:center"><span style="font-size:18px">${HUMORES[e.humor-1]}</span><span class="f12 c-muted">${new Date(e.fecha+'T12:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</span></div>
        <div class="flex gap6"><span class="f13 c-dim">${exp?'▲':'▼'}</span><button class="del-btn" onclick="event.stopPropagation();deleteEntrada(${e.id})" style="font-size:16px">×</button></div>
      </div>
      ${exp?`${e.foto?`<img class="dia-img" src="${e.foto}" alt="Foto del día"/>`:''}${e.texto?`<div class="entry-body">${e.texto}</div>`:''}`:`<div class="flex gap10" style="align-items:center;margin-top:6px">${e.foto?`<img class="dia-thumb" src="${e.foto}" alt=""/>`:''}<div class="entry-preview" style="margin-top:0;min-width:0">${e.texto||'📷 Foto'}</div></div>`}
    </div>`;
  });
  document.getElementById('page-diario').innerHTML=html;
}
function setHumor(n){keepDraft();diarioHumor=n;renderDiario();}
function quitarFoto(){keepDraft();diarioFoto=null;renderDiario();}
function pickFoto(inp){
  const f=inp.files[0];if(!f)return;keepDraft();
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    diarioFoto=c.toDataURL('image/jpeg',.72);renderDiario();};
    im.src=rd.result;};
  rd.readAsDataURL(f);
}
function toggleEntry(id){expandedEntry=expandedEntry===id?null:id;renderDiario();}
function guardarEntrada(){
  const txt=document.getElementById('diario-txt').value.trim();if(!txt&&!diarioFoto)return;
  const en={id:nid(state.diario),fecha:today(),texto:txt,humor:diarioHumor,ts:Date.now()};
  if(diarioFoto)en.foto=diarioFoto;
  state.diario.unshift(en);
  try{localStorage.setItem(KEY+'diario',JSON.stringify(state.diario));}
  catch(e){state.diario.shift();diarioDraft=txt;alert('No hay espacio para guardar esta foto. Borra fotos de entradas anteriores o guarda la entrada sin foto.');renderDiario();return;}
  diarioFoto=null;diarioDraft='';renderDiario();
}
function deleteEntrada(id){state.diario=state.diario.filter(e=>e.id!==id);save('diario');if(expandedEntry===id)expandedEntry=null;renderDiario();}

  h+=m.vista==='menu'?menuDias(w):menuCompras(w);

function menuSet(k,v){state.menu[k]=v;save('menu');renderMenu();}
function menuDias(w){
  let h='';
  MENU[w-1].forEach((d,i)=>{
    h+=`<div class="card mn-day"><div class="mn-day-t">Día ${i+1}</div>`;
    d.forEach((x,j)=>{
      const[n,det]=(MN_R[x]||x).split('|');
      h+=`<div class="mn-row${j%2?' snack':''}"><div class="mn-l">${MN_L[j]}</div><div><div class="mn-n">${n}</div>${det?`<div class="mn-d">${det}</div>`:''}</div></div>`;
    });
    h+='</div>';
  });
  return h+`<div class="f12 c-muted" style="line-height:1.6;padding:0 4px 8px">Las colaciones son solo si hay apetito. Porciones por persona, para 2 personas. 3 L de agua al día, sin líquidos junto con la comida (30–60 min antes o después). Máximo 2 tortillas de maíz al día.</div>`;

function lista(w){
  const m=state.menu;m.lst=m.lst||{};
  if(!m.lst[w])m.lst[w]=Object.entries(COMPRAS[w-1]).map(([c,s])=>({c,items:s.split('|').map(t=>({t,ok:false}))}));
  return m.lst[w];
}
function menuCompras(w){
  const L=lista(w);let tot=0,ok=0;
  L.forEach(g=>g.items.forEach(i=>{tot++;if(i.ok)ok++;}));
  let h=`<div class="card teal"><div class="flex-between mb8"><span class="f13 fw7 c-main">Semana ${w}</span><span class="f12 c-teal fw7">${ok} de ${tot}</span></div>${bar(tot?ok/tot*100:0)}</div>`;
  L.forEach((g,gi)=>{
    h+=`<div class="card"><div class="flex-between mb6"><span class="f13 fw7 c-teal">${escH(g.c)}</span><button class="del-btn" onclick="delCat(${w},${gi})" aria-label="Quitar categoría">🗑</button></div>`;
    g.items.forEach((it,ii)=>{
      h+=`<div class="mn-item${it.ok?' done':''}"><div class="check${it.ok?' done':''}" onclick="toggleCompra(${w},${gi},${ii})"></div><span style="flex:1" onclick="toggleCompra(${w},${gi},${ii})">${escH(it.t)}</span><button class="del-btn" onclick="editCompra(${w},${gi},${ii})" aria-label="Editar">✎</button><button class="del-btn" onclick="delCompra(${w},${gi},${ii})" aria-label="Quitar">×</button></div>`;
    });
    h+=`<div class="mn-add"><input class="inp" id="add-${gi}" placeholder="Añadir artículo…" onkeydown="if(event.key==='Enter')addCompra(${w},${gi})"/><button class="btn sm" onclick="addCompra(${w},${gi})">＋</button></div></div>`;
  });
  return h+`<div class="flex gap8 mb10"><button class="btn sm" style="flex:1" onclick="addCat(${w})">＋ Categoría</button><button class="btn sm" style="flex:1" onclick="resetCompras(${w})">Desmarcar todo</button></div><button class="btn" style="width:100%;margin-bottom:8px" onclick="registrarCompra(${w})">🛒 Registrar gasto en Dinero</button><button class="btn sm" style="width:100%" onclick="restaurarLista(${w})">Restaurar lista original</button>`;
}
function saveMenu(){save('menu');renderMenu();}
function toggleCompra(w,g,i){const it=lista(w)[g].items[i];it.ok=!it.ok;saveMenu();}
function addCompra(w,g){const t=document.getElementById('add-'+g).value.trim();if(!t)return;lista(w)[g].items.push({t,ok:false});saveMenu();}
function editCompra(w,g,i){const it=lista(w)[g].items[i],t=prompt('Editar artículo',it.t);if(t&&t.trim()){it.t=t.trim();saveMenu();}}
function delCompra(w,g,i){lista(w)[g].items.splice(i,1);saveMenu();}
function addCat(w){const c=prompt('Nombre de la categoría');if(c&&c.trim()){lista(w).push({c:c.trim(),items:[]});saveMenu();}}
function delCat(w,g){if(confirm('¿Quitar esta categoría y sus artículos?')){lista(w).splice(g,1);saveMenu();}}
function resetCompras(w){lista(w).forEach(g=>g.items.forEach(i=>i.ok=false));saveMenu();}
function restaurarLista(w){if(confirm('¿Volver a la lista original de la semana '+w+'? Se pierden tus cambios.')){delete state.menu.lst[w];saveMenu();}}

// ══ AGENDA / CALENDARIO ═════════════════════════════════════════════════════
const EV_T={evento:['📌','#6a9a55','Evento'],pago:['💸','#ef4444','Pago'],suscripcion:['🔁','#a3b18a','Suscripción']};
const REPL={no:'No se repite',semanal:'Cada semana',mensual:'Cada mes',anual:'Cada año'};
let calM=(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};})(),calSel=today();
function pd(s){return new Date(s+'T12:00:00');}
function ocurre(e,ds){
  if(ds<e.fecha)return false;
  if(!e.repite||e.repite==='no')return ds===e.fecha;
  const a=pd(e.fecha),b=pd(ds);
  if(e.repite==='semanal')return Math.round((b-a)/864e5)%7===0;
  if(e.repite==='mensual')return b.getDate()===Math.min(a.getDate(),new Date(b.getFullYear(),b.getMonth()+1,0).getDate());
  return b.getMonth()===a.getMonth()&&b.getDate()===a.getDate();
}
function itemsDia(ds){
  const r=state.eventos.filter(e=>ocurre(e,ds)).map(e=>({...e,ds}));
  state.deudas.forEach(d=>{if(d.deadline===ds&&d.monto-d.pagado>0)r.push({id:'d'+d.id,titulo:(d.nombre||'Deuda')+' (deuda)',tipo:'pago',monto:d.monto-d.pagado,ro:true,ds});});
  return r;
}
function proximos(n){
  const b=new Date(),out=[];
  for(let i=0;i<n;i++){const ds=ymd(new Date(b.getFullYear(),b.getMonth(),b.getDate()+i));itemsDia(ds).forEach(it=>out.push({...it,i}));}
  return out;
}
function relDia(i,ds){return (i===0?'Hoy':i===1?'Mañana':'En '+i+' días')+' · '+pd(ds).toLocaleDateString('es',{day:'numeric',month:'short'});}
function evRow(it,label){
  const paid=it.pag&&it.pag[it.ds],T=EV_T[it.tipo];
  const sub=[label,T[2]+(it.repite&&it.repite!=='no'?' ('+REPL[it.repite].toLowerCase()+')':''),it.monto?fmt(it.monto):''].filter(Boolean).join(' · ');
  return `<div class="ev-row"><span style="font-size:18px">${T[0]}</span><div style="flex:1;min-width:0"${it.ro?'':` onclick="openEvento(${it.id})"`}><div class="f13 fw7 c-main" style="${paid?'text-decoration:line-through;opacity:.5':''}">${escH(it.titulo)}</div><div class="f11" style="color:${it.i<=2&&!paid&&it.tipo!=='evento'?'#f59e0b':'var(--s5)'}">${sub}</div></div>${it.tipo!=='evento'&&!it.ro?`<button class="btn sm" onclick="togglePag(${it.id},'${it.ds}')">${paid?'✓ Pagado':'Pagar'}</button>`:''}</div>`;
}
function proximosCard(){
  const l=proximos(14).filter(it=>!(it.pag&&it.pag[it.ds])).slice(0,5);
  if(!l.length)return '';
  return `<div class="card"><div class="f14 fw7 c-main mb6">📆 Próximos</div>${l.map(it=>evRow(it,relDia(it.i,it.ds))).join('')}</div>`;
}
function renderFinPagos(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),nd=new Date(y,m+1,0).getDate();let tot=0;
  for(let d=1;d<=nd;d++)itemsDia(ymd(new Date(y,m,d))).forEach(it=>{if(it.tipo!=='evento')tot+=it.monto||0;});
  const l=proximos(45).filter(it=>it.tipo!=='evento');
  return `<div class="card red"><div class="label c-red">Pagos y suscripciones este mes</div><div class="f22 fw8 c-red">${fmt(tot)}</div></div>
  <div class="card"><div class="label mb4">Próximos 45 días</div>${l.length?l.map(it=>evRow(it,relDia(it.i,it.ds))).join(''):'<div class="f13 c-muted text-center" style="padding:16px">Sin pagos próximos</div>'}</div>
  <button class="btn" onclick="openEvento(null,today(),'suscripcion')" style="padding:13px;border-radius:12px;margin-bottom:8px">+ Añadir pago o suscripción</button>
  <button class="btn sm" style="width:100%" onclick="goTab('inicio')">Ver en el calendario</button>`;
}
function renderAgenda(){
  const{y,m}=calM,first=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate(),td=today();
  let h=`<div class="page-title">📆 Agenda</div><div class="flex-between mb12"><button class="btn sm" onclick="calNav(-1)" aria-label="Mes anterior">◀</button><div class="f15 fw7 c-main" style="text-transform:capitalize">${new Date(y,m,1).toLocaleDateString('es',{month:'long',year:'numeric'})}</div><div class="flex gap6"><button class="btn sm" onclick="calHoy()">Hoy</button><button class="btn sm" onclick="calNav(1)" aria-label="Mes siguiente">▶</button></div></div><div class="card"><div class="cal-grid">${['L','M','M','J','V','S','D'].map(x=>`<div class="cal-h">${x}</div>`).join('')}`;
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=nd;d++){
    const ds=ymd(new Date(y,m,d)),its=itemsDia(ds),ts=[...new Set(its.map(x=>x.tipo))];
    h+=`<button class="cal-d${ds===td?' today':''}${ds===calSel?' sel':''}" onclick="calPick('${ds}')">${d}<span class="cal-dots">${ts.map(t=>`<i style="background:${EV_T[t][1]}"></i>`).join('')}</span></button>`;
  }
  const its=itemsDia(calSel);
  h+=`</div></div><div class="card"><div class="flex-between mb6"><span class="f14 fw7 c-main" style="text-transform:capitalize">${pd(calSel).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</span><button class="btn sm" onclick="openEvento(null,'${calSel}')">＋ Añadir</button></div>${its.length?its.map(it=>evRow(it,'')).join(''):'<div class="f13 c-muted" style="padding:10px 0">Nada este día.</div>'}</div><div class="f11 c-muted" style="padding:0 4px">📌 evento · 💸 pago · 🔁 suscripción. Las deudas con fecha también aparecen aquí.</div>`;

function ticketImg(f){

    im.onload=()=>{const r=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.35)';x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c);};

function montoDe(t){const s=t.replace(/[$\s]/g,''),m=s.match(/[.,](\d{2})$/);return m?parseFloat(s.slice(0,-3).replace(/[.,]/g,'')+'.'+m[1]):NaN;}
function parseTicket(txt){
  const L=txt.split('\n').map(l=>l.trim()).filter(Boolean),RX=/\$?\s*\d{1,3}(?:[.,]\d{3})*[.,]\d{2}\b|\$?\s*\d+[.,]\d{2}\b/g;
  const nums=l=>(l.match(RX)||[]).map(montoDe).filter(n=>n>0);
  let tot=0;
  L.filter(l=>/total|importe|a pagar/i.test(l)&&!/subtotal|iva|cambio|recib/i.test(l)).forEach(l=>nums(l).forEach(n=>{if(n>tot)tot=n;}));
  if(!tot)L.filter(l=>!/cambio|efectivo|recib|pag[oó] con|iva/i.test(l)).forEach(l=>nums(l).forEach(n=>{if(n>tot)tot=n;}));
  let fecha='';const d=txt.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(d){let[,a,b,y]=d;y=y.length===2?'20'+y:y;if(+b>=1&&+b<=12&&+a>=1&&+a<=31){const f=y+'-'+b.padStart(2,'0')+'-'+a.padStart(2,'0');if(f<=ymd(new Date(Date.now()+864e5)))fecha=f;}}
  const nombre=(L.find(l=>/[A-Za-zÁÉÍÓÚÑáéíóúñ]{3,}/.test(l))||'').slice(0,40);
  const T=txt.toLowerCase(),K=[['Supermercado/Despensa',/walmart|soriana|heb|chedraui|costco|sam'?s|oxxo|super|mercado|aurrera|la comer|smart/],['Gasolina/Transporte',/pemex|gasolin|magna|premium|diesel|shell|mobil|uber|didi/],['Restaurantes/Comida',/restaurante|caf[eé]|taquer|pizza|burger|starbucks|mcdonald|sushi|comida/],['Salud/Farmacia',/farmacia|guadalajara|benavides|similares|medic/],['Ropa/Compras',/coppel|liverpool|zara|h&m|ropa/],['Servicios/Hogar',/\bcfe\b|telmex|gas natural|totalplay|izzi|telcel/],['Entretenimiento/Salidas',/cin[eé]polis|cinemex|boleto/]];
  const cat=(K.find(([,r])=>r.test(T))||[])[0]||'';
  return{tot,fecha,nombre,cat};
}
async function scanTicket(inp){
  const f=inp.files[0],st=document.getElementById('scan-st');if(!f)return;
  try{
    st.textContent='Preparando lector…';await loadOcr();st.textContent='Leyendo ticket…';
    const img=await ticketImg(f),{data}=await Tesseract.recognize(img,'spa',{logger:m=>{if(m.status==='recognizing text')st.textContent='Leyendo ticket… '+Math.round(m.progress*100)+'%';}});
    const r=parseTicket(data.text),set=(id,v)=>{const e=document.getElementById(id);if(e&&v){e.value=v;e.dispatchEvent(new Event('change',{bubbles:true}));}};
    set('tx-monto',r.tot||'');set('tx-fecha',r.fecha);set('tx-nota',r.nombre);set('tx-cat',r.cat);
    st.textContent=r.tot?`Listo: ${fmt(r.tot)}${r.fecha?' · '+r.fecha:''}. Revisa los datos antes de guardar.`:'Leí el ticket pero no encontré el total. Captúralo a mano.';
  }catch(e){st.textContent='No pude leer el ticket (¿sin internet?). Captura los datos a mano.';}
}

calcRacha=function(){const ids=new Set(state.habitos.map(h=>h.id)),has=d=>(state.hist[ymd(d)]||[]).some(i=>ids.has(i));let r=0,d=new Date();if(!has(d))d.setDate(d.getDate()-1);while(has(d)){r++;d.setDate(d.getDate()-1);}return r;};
function habitosExtras(){
  const H=state.habitos;if(!H.length)return'';const td=today();
  const done=d=>(state.hist[d]||[]).filter(id=>H.some(h=>h.id===id)).length;
  const mk=o=>{const m=new Date();m.setDate(m.getDate()-((m.getDay()+6)%7)+7*o);return[...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return ymd(d);});};
  const wd=mk(hwOff),cur=mk(0),L=['L','M','X','J','V','S','D'];
  let h=`<div class="card"><div class="flex-between"><div class="label">${hwOff?'Semana pasada':'Esta semana'}</div><div><button class="btn sm" onclick="hwMove(-1)">‹</button> <button class="btn sm" onclick="hwMove(1)" ${hwOff?'':'disabled style="opacity:.3"'}>›</button></div></div>
   <div class="f11 c-muted" style="margin-top:2px">Toca un círculo para marcar el día</div>
   <div class="mx hd"><span></span>${wd.map((d,i)=>`<div class="${d===td?'t':''}">${L[i]}<small>${+d.slice(8)}</small></div>`).join('')}<span></span></div>`+
   H.map(x=>{const n=wd.filter(d=>(state.hist[d]||[]).includes(x.id)).length;return`<div class="mx"><span class="hn" onclick="editHabito(${x.id})">${x.emoji||'✅'} ${x.nombre}</span>${wd.map(d=>`<button class="dc${(state.hist[d]||[]).includes(x.id)?' on':''}" ${d>td?'disabled':''} onclick="toggleDay(${x.id},'${d}')"></button>`).join('')}<span class="f11 c-muted">${n}/7</span></div>`;}).join('')+`<div class="f11 c-muted" style="margin-top:10px">Toca el nombre para editar</div></div>`;
  h+=`<div class="dk" style="text-align:center"><div style="font-size:12px;opacity:.8">Racha actual</div><div style="font-size:44px;font-weight:800">🔥 ${calcRacha()}</div><div style="font-size:12px;color:#b5d98a">¡Sigue así!</div>
   <div class="wk">${cur.map((d,i)=>`<div>${L[i]}<i class="${done(d)?'on':''}"></i></div>`).join('')}</div></div>`;
  const mon=new Date(cur[0]+'T00:00:00');
  const wk=[...Array(5)].map((_,k)=>{const m=new Date(mon);m.setDate(m.getDate()-7*(4-k));let t=0;for(let i=0;i<7;i++){const d=new Date(m);d.setDate(d.getDate()+i);t+=done(ymd(d));}return Math.round(t/(7*H.length)*100);});
  const best=wk.indexOf(Math.max(...wk));
  h+=`<div class="dk"><div style="font-size:13px;font-weight:700">Resumen de 5 semanas</div><div class="chart">${wk.map((p,i)=>`<div class="${i===best?'best':''}">${p}%<span style="height:${Math.max(p,3)}%"></span>S${i+1}</div>`).join('')}</div></div>`;
  const cnt=H.map(x=>({x,n:Object.values(state.hist).filter(a=>a.includes(x.id)).length})).sort((a,b)=>b.n-a.n)[0];
  if(cnt.n)h+=`<div class="card" style="display:flex;align-items:center;gap:14px">${ring(Math.min(100,Math.round(cnt.n/30*100)),64,6,'#86ab5b')}<div><div class="label">Hábito estrella</div><div class="f15 fw7">${cnt.x.emoji||''} ${cnt.x.nombre}</div><div class="f11 c-muted">${cnt.n} días registrados</div></div></div>`;
  return h;
}

function iconize(root){const ns=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(!/^(SCRIPT|STYLE|TEXTAREA|OPTION|TITLE)$/.test(n.parentNode.nodeName)&&RXT.test(n.data))ns.push(n);}
 ns.forEach(n=>{const esc=n.data.replace(/&/g,'&amp;').replace(/</g,'&lt;');let ch=false;const out=esc.replace(RXG,m=>{const k=EM[m.replace('\uFE0F','')];if(!k)return m;ch=true;return`<svg class="ic" viewBox="0 0 24 24">${ICO[k]}</svg>`;});
