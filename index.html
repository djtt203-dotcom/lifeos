<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LifeOS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--s9);min-height:100vh}
input,select,textarea,button{font-family:'Inter',sans-serif}
input:focus,select:focus,textarea:focus{outline:none;border-color:#00d4aa!important}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--card)}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:4px}
#app{max-width:480px;margin:0 auto;padding-bottom:20px}
.header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-size:17px;font-weight:800;letter-spacing:-.5px}.logo span{color:#00d4aa}
.header-date{font-size:10px;color:var(--s4);margin-top:1px}
.header-badges{display:flex;gap:6px;align-items:center}
.badge{border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700}
.badge-fire{background:#f59e0b22;border:1px solid #f59e0b33;color:#f59e0b}
.badge-xp{background:#6366f122;border:1px solid #6366f133;color:#a5b4fc;text-align:center}
.badge-xp .lv{font-size:9px;color:#6366f1;font-weight:700;line-height:1}
.badge-xp .xp{font-size:11px;font-weight:800}
.badge-focus{background:#6366f122;border:1px solid #6366f133;color:#a5b4fc;cursor:pointer;border:none;border-radius:8px}
.tabs-bar{display:flex;gap:3px}
.tab-btn{flex:1;padding:7px 2px;border-radius:8px;border:none;cursor:pointer;background:transparent;color:var(--s4);font-size:9px;font-weight:700;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab-btn .ico{font-size:15px}
.tab-btn.active{background:#00d4aa;color:#050d1a}
.content{padding:16px}
.page-title{font-size:19px;font-weight:800;margin-bottom:14px;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.card.purple{background:linear-gradient(135deg,#6366f10a,var(--card));border-color:#6366f122}
.card.teal{background:linear-gradient(135deg,#00d4aa0e,var(--card))}
.card.red{background:linear-gradient(135deg,#ef44440a,var(--card));border-color:#ef444422}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.bar-wrap{background:var(--bd);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .5s ease}
.inp{background:var(--bd);border:1px solid var(--bd2);border-radius:8px;color:var(--s9);padding:10px 12px;font-size:13px;width:100%}
.inp::placeholder{color:var(--s4)}
textarea.inp{resize:none;line-height:1.6}
select.inp{appearance:none;cursor:pointer}
.btn{background:#00d4aa;color:#050d1a;border:none;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;width:100%;transition:opacity .2s}
.btn:hover{opacity:.88}
.btn.purple{background:#6366f1;color:#fff}
.btn.red{background:#ef4444;color:#fff}
.btn.amber{background:#f59e0b;color:#050d1a}
.btn.sm{background:transparent;border:1px solid var(--bd);color:var(--s5);border-radius:7px;padding:6px 10px;font-size:12px;width:auto}
.btn.danger{background:transparent;border:1px solid #ef444433;color:#ef4444;font-size:12px;font-weight:600}
.label{font-size:11px;color:var(--s5);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.sublabel{font-size:12px;color:var(--s5);margin-bottom:6px}
.cat-dot{width:3px;height:16px;border-radius:2px;flex-shrink:0}
.habit-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;transition:all .2s;cursor:pointer}
.habit-item.done{border-color:#00d4aa44;background:#00d4aa08}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--s3);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;cursor:pointer}
.check.done{background:#00d4aa;border-color:#00d4aa}
.check.done::after{content:'✓';font-size:13px;color:#050d1a;font-weight:900}
.habit-name{font-size:14px;font-weight:600;color:var(--s8);transition:all .2s}
.habit-name.done{color:#00d4aa;text-decoration:line-through}
.habit-id{font-size:11px;color:var(--s4);margin-top:2px}
.xp-tag{font-size:11px;color:#00d4aa;font-weight:700;margin-left:auto;white-space:nowrap}
.ring-wrap{position:relative;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.ring-pct{font-size:13px;font-weight:700;color:var(--s9)}
.modal-bg{position:fixed;inset:0;background:#000000bb;z-index:999;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--card);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:700;color:var(--s9)}
.modal-close{background:var(--bd);border:none;color:var(--s6);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px}
.form-row{margin-bottom:12px}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.emoji-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.emoji-btn{font-size:20px;background:transparent;border:1.5px solid var(--bd);border-radius:8px;padding:5px 8px;cursor:pointer;transition:all .2s}
.emoji-btn.sel{background:#00d4aa22;border-color:#00d4aa}
.modal-actions{display:flex;gap:8px;margin-top:4px}
#onboarding{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.ob-wrap{width:100%;max-width:420px}
.ob-logo{text-align:center;margin-bottom:24px;font-size:22px;font-weight:800}
.ob-progress{display:flex;gap:6px;margin-bottom:24px}
.ob-bar{flex:1;height:3px;border-radius:99px;background:var(--bd);transition:background .3s}
.ob-bar.active{background:#00d4aa}
.ob-step{display:none}.ob-step.active{display:block}
.ob-emoji{font-size:52px;text-align:center;margin-bottom:16px}
.ob-h{font-size:23px;font-weight:800;color:var(--s9);margin-bottom:8px}
.ob-p{color:var(--s5);font-size:14px;line-height:1.6;margin-bottom:16px}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.goal-btn{background:var(--bd);border:1.5px solid var(--bd2);border-radius:10px;padding:12px 10px;cursor:pointer;text-align:left;color:var(--s6);font-size:13px;font-weight:600;transition:all .2s}
.goal-btn .ge{font-size:18px;display:block;margin-bottom:4px}
.goal-btn.sel{background:#00d4aa22;border-color:#00d4aa;color:#00d4aa}
#focus-mode{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.focus-close{position:absolute;top:20px;right:20px;background:var(--bd);border:none;color:var(--s5);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:18px}
.focus-label{font-size:13px;color:var(--s5);margin-bottom:8px;text-transform:uppercase;letter-spacing:2px}
.focus-ring{position:relative;margin-bottom:24px}
.focus-ring svg{transform:rotate(-90deg)}
.focus-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:var(--s9);letter-spacing:-2px}
.focus-btns{display:flex;gap:10px;margin-bottom:20px}
.focus-presets{display:flex;gap:8px}
.humor-row{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.humor-btn{font-size:28px;background:none;border:2px solid transparent;border-radius:10px;padding:6px;cursor:pointer;transition:border .2s}
.humor-btn.sel{border-color:#00d4aa}
.entry-preview{font-size:12px;color:var(--s4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.entry-body{font-size:13px;color:var(--s6);line-height:1.7;border-top:1px solid var(--bd);padding-top:12px;margin-top:8px}
.sub-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.sub-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--s3);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s}
.sub-check.done{border-color:#00d4aa;background:#00d4aa}
.sub-check.done::after{content:'✓';font-size:10px;color:#050d1a;font-weight:900}
.sub-text{flex:1;font-size:13px;color:var(--s7)}
.sub-text.done{color:var(--s5);text-decoration:line-through}
.del-btn{background:none;border:none;color:var(--s4);cursor:pointer;font-size:15px;padding:2px 4px}
.cat-badge{border-radius:5px;padding:2px 7px;font-size:10px;font-weight:700;display:inline-block}
.section-cat{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.section-cat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
.empty-state{text-align:center;padding:40px 20px;color:var(--s4)}
.empty-state .es-ico{font-size:48px;margin-bottom:12px}
.empty-state .es-t{font-size:15px;color:var(--s5)}
.empty-state .es-s{font-size:13px;color:var(--s4);margin-top:4px}
/* ─── FINANZAS específico ─── */
.fin-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.fin-tab{padding:7px 14px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--s5);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.fin-tab.active{background:#00d4aa22;border-color:#00d4aa;color:#00d4aa}
.tx-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.tx-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-name{font-size:13px;font-weight:600;color:var(--s8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--s4);margin-top:1px}
.tx-amount{font-size:14px;font-weight:700;white-space:nowrap}
.tx-amount.ingreso{color:#00d4aa}
.tx-amount.gasto{color:#ef4444}
.deuda-item{padding:14px 0;border-bottom:1px solid var(--bd)}
.deuda-name{font-size:14px;font-weight:600;color:var(--s9);margin-bottom:4px}
.pill{display:inline-block;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:700}
.pill-red{background:#ef444422;color:#ef4444}
.pill-amber{background:#f59e0b22;color:#f59e0b}
.pill-green{background:#00d4aa22;color:#00d4aa}
.tipo-sel{display:flex;gap:6px;margin-bottom:12px}
.tipo-btn{flex:1;padding:9px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--s5);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.tipo-btn.sel-ingreso{background:#00d4aa22;border-color:#00d4aa;color:#00d4aa}
.tipo-btn.sel-gasto{background:#ef444422;border-color:#ef4444;color:#ef4444}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.week-nav button{background:var(--bd);border:none;color:var(--s6);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.week-nav span{font-size:13px;font-weight:600;color:var(--s9)}
/* misc */
.hidden{display:none!important}
.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}
.flex-center{display:flex;align-items:center}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
.mt4{margin-top:4px}.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt14{margin-top:14px}.mt16{margin-top:16px}
.mb4{margin-bottom:4px}.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}.mb16{margin-bottom:16px}
.f10{font-size:10px}.f11{font-size:11px}.f12{font-size:12px}.f13{font-size:13px}.f14{font-size:14px}.f15{font-size:15px}.f20{font-size:20px}.f22{font-size:22px}.f30{font-size:30px}
.fw7{font-weight:700}.fw8{font-weight:800}
.c-teal{color:#00d4aa}.c-purple{color:#6366f1}.c-amber{color:#f59e0b}.c-cyan{color:#22d3ee}.c-pink{color:#ec4899}.c-muted{color:var(--s5)}.c-dim{color:var(--s4)}.c-main{color:var(--s9)}.c-sub{color:var(--s6)}.c-mid{color:var(--s7)}.c-red{color:#ef4444}
.text-center{text-align:center}.w100{width:100%}.italic{font-style:italic}
.ls1{letter-spacing:1px}.ls15{letter-spacing:1.5px}
</style>
<style>
.mn-day{padding:12px 14px}.mn-day-t{font-size:14px;font-weight:800;color:#00d4aa;margin-bottom:6px}
.mn-row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.mn-l{width:66px;flex-shrink:0;font-size:11px;font-weight:600;color:var(--s5);padding-top:2px}
.mn-n{font-size:13px;font-weight:600;color:var(--s8)}.mn-row.snack .mn-n{font-weight:500;color:var(--s6)}
.mn-d{font-size:11px;color:var(--s5);line-height:1.5;margin-top:2px}
.mn-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer;font-size:13px;color:var(--s7)}
.mn-item .check{width:20px;height:20px;border-radius:6px}.mn-add{display:flex;gap:8px;margin-top:10px}.mn-add .inp{padding:8px 10px}.mn-add .btn.sm{padding:6px 14px;font-size:16px}
.mn-item.done span{color:var(--s4);text-decoration:line-through}
</style>
<style>
.cs-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;cursor:pointer;transition:border-color .2s}
.cs-btn:hover,.cs-btn:focus-visible{border-color:#00d4aa;outline:none}
.cs-bg{position:fixed;inset:0;background:#000000aa;z-index:1200;display:flex;align-items:flex-end;justify-content:center;animation:csFade .18s ease}
.cs-box{background:var(--card);border:1px solid var(--bd);border-bottom:none;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:70vh;padding:8px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;animation:csUp .22s ease}
.cs-grab{width:38px;height:4px;border-radius:4px;background:var(--s3);margin:4px auto 12px}
.cs-title{font-size:13px;font-weight:700;color:var(--s6);margin:0 6px 10px}
.cs-list{overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.cs-opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--s7);font-size:15px;font-weight:500;text-align:left;cursor:pointer;transition:background .15s}
.cs-opt:hover{background:var(--bd)}
.cs-opt.sel{background:#00d4aa14;border-color:#00d4aa55;color:#00d4aa;font-weight:700}
.cs-opt i{width:20px;height:20px;border-radius:50%;border:2px solid var(--s3);flex-shrink:0;position:relative}
.cs-opt.sel i{background:#00d4aa;border-color:#00d4aa}
.cs-opt.sel i::after{content:'';position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #050d1a;border-width:0 2px 2px 0;transform:rotate(45deg)}
@keyframes csUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes csFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.cs-bg,.cs-box{animation:none}}
</style>
<style>
.dia-add{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--s6)}
.dia-prev{position:relative}.dia-prev img{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.dia-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:none;background:#000000aa;color:var(--s9);font-size:16px;cursor:pointer}
.dia-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--bd)}
.dia-img{display:block;width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--bd)}
</style>
<style>
.agua{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.vaso{padding:8px 0;border-radius:8px;border:1px solid var(--bd);background:transparent;font-size:16px;opacity:.3;cursor:pointer;transition:all .15s}
.vaso.on{opacity:1;background:#22d3ee22;border-color:#22d3ee55}
.pr-inp{width:100px;padding:6px 8px;font-size:12px;text-align:right}
</style>
<script>(function(){try{var t=JSON.parse(localStorage.getItem('lifeos_theme'))||'dark';document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<style>
:root{--bg:#0b1120;--card:#0f172a;--bd:#1e293b;--bd2:#2d3f55;--s3:#334155;--s4:#475569;--s5:#64748b;--s6:#94a3b8;--s7:#cbd5e1;--s8:#e2e8f0;--s9:#f1f5f9;color-scheme:dark}
html[data-theme=light]{--bg:#f3f5f9;--card:#ffffff;--bd:#e3e8f0;--bd2:#cfd8e3;--s3:#cbd5e1;--s4:#94a3b8;--s5:#64748b;--s6:#475569;--s7:#334155;--s8:#1e293b;--s9:#0f172a;color-scheme:light}
html[data-theme=light] .c-teal,html[data-theme=light] .habit-name.done,html[data-theme=light] .fin-tab.active,html[data-theme=light] .cs-opt.sel,html[data-theme=light] .mn-day-t,html[data-theme=light] .xp-tag{color:#00967a}
html[data-theme=light] .c-purple,html[data-theme=light] .badge-focus{color:#4f46e5}
html[data-theme=light] .card{box-shadow:0 1px 2px #0f172a10}
</style>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0b1120"/>
</head>
<body>

<!-- ══ ONBOARDING ══════════════════════════════════════════════════════════ -->
<div id="onboarding">
  <div class="ob-wrap">
    <div class="ob-logo"><span style="color:#00d4aa">◆</span> LifeOS</div>
    <div class="ob-progress">
      <div class="ob-bar" id="ob-b1"></div><div class="ob-bar" id="ob-b2"></div><div class="ob-bar" id="ob-b3"></div>
    </div>
    <div class="card ob-step active" id="ob-s0">
      <div class="ob-emoji">✨</div>
      <div style="text-align:center">
        <h2 class="ob-h">Tu vida cambia hoy.</h2>
        <p class="ob-p">Hábitos, metas, finanzas completas y diario — todo en un solo lugar.</p>
        <button class="btn" onclick="obStep(1)" style="padding:13px;font-size:15px">Empezar →</button>
      </div>
    </div>
    <div class="card ob-step" id="ob-s1">
      <h2 class="ob-h mb8">¿Cómo te llamas?</h2>
      <p class="ob-p" style="margin-bottom:14px">Para personalizar tu experiencia.</p>
      <input class="inp mb16" id="ob-name" placeholder="Tu nombre..." style="font-size:18px;font-weight:600"/>
      <button class="btn" onclick="obStep(2)" style="padding:12px">Continuar →</button>
    </div>
    <div class="card ob-step" id="ob-s2">
      <h2 class="ob-h mb8">¿Qué quieres lograr?</h2>
      <div class="goal-grid">
        <button class="goal-btn" onclick="toggleGoal(this,'Ponerme en forma')"><span class="ge">💪</span>Ponerme en forma</button>
        <button class="goal-btn" onclick="toggleGoal(this,'Aprender algo nuevo')"><span class="ge">🧠</span>Aprender algo nuevo</button>
        <button class="goal-btn" onclick="toggleGoal(this,'Mejorar mis finanzas')"><span class="ge">💰</span>Mejorar mis finanzas</button>
        <button class="goal-btn" onclick="toggleGoal(this,'Reducir el estrés')"><span class="ge">😌</span>Reducir el estrés</button>
        <button class="goal-btn" onclick="toggleGoal(this,'Mejorar relaciones')"><span class="ge">❤️</span>Mejorar relaciones</button>
        <button class="goal-btn" onclick="toggleGoal(this,'Avanzar en mi carrera')"><span class="ge">🚀</span>Avanzar en mi carrera</button>
        <button class="goal-btn" onclick="toggleGoal(this,'Leer más')"><span class="ge">📚</span>Leer más</button>
        <button class="goal-btn" onclick="toggleGoal(this,'Viajar')"><span class="ge">🌍</span>Viajar</button>
      </div>
      <button class="btn" onclick="obStep(3)" style="padding:12px">Continuar →</button>
    </div>
    <div class="card ob-step" id="ob-s3">
      <h2 class="ob-h mb8">Tu visión de vida</h2>
      <p class="f11 c-dim mb12">¿Cómo quieres ser en 1 año? La verás cada día.</p>
      <textarea class="inp mb16" id="ob-vision" rows="4" placeholder="Ej: Quiero ser alguien saludable, libre financieramente..."></textarea>
      <button class="btn" onclick="obFinish()" style="padding:12px;font-size:14px">Comenzar mi transformación 🚀</button>
    </div>
  </div>
</div>

</div>

<!-- ══ FOCUS MODE ══════════════════════════════════════════════════════════ -->
<div id="focus-mode" class="hidden">
  <button class="focus-close" onclick="closeFocus()">×</button>

    <svg width="200" height="200">
      <circle cx="100" cy="100" r="88" fill="none" stroke="var(--bd)" stroke-width="10"/>
      <circle id="focus-circle" cx="100" cy="100" r="88" fill="none" stroke="#6366f1" stroke-width="10" stroke-dasharray="0 553" stroke-linecap="round"/>
    </svg>
    <div class="focus-time" id="focus-time">25:00</div>

<!-- ══ MODAL ════════════════════════════════════════════════════════════════ -->
<div id="modal" class="modal-bg hidden" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ══ STATE ══════════════════════════════════════════════════════════════════
const KEY='lifeos_';
function ls(k,d){try{const v=localStorage.getItem(KEY+k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch{}}

let state={
  user: ls('user',null),
  habitos: ls('habitos',[]),
  metas: ls('metas',[]),
  comp: ls('comp',{}),
  diario: ls('diario',[]),
  menu: ls('menu',{sem:1,vista:'menu',chk:{}}),
  agua: ls('agua',{}),
  presup: ls('presup',{}),
  hist: ls('hist',{}),
  // FINANZAS
  txs: ls('txs',[]),        // transacciones: {id,fecha,tipo,categoria,cuenta,monto,nota}
  deudas: ls('deudas',[]),  // {id,nombre,prestamista,monto,pagado,deadline,tipo}
  ingresos: ls('ingresos',[]), // {id,fecha,tipo,monto,cuenta,nota}  tipo=sueldo|bono|otro
};
function save(k){lsSet(k,state[k]);}
function nid(a){return a.length?Math.max(...a.map(x=>x.id))+1:1;}
function today(){return new Date().toISOString().slice(0,10);}
function fmt(n){return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});}

const CATS_H=['Salud','Mente','Trabajo','Relaciones','Dinero','Crecimiento'];
const CCAT={Salud:'#00d4aa',Mente:'#a78bfa',Trabajo:'#6366f1',Relaciones:'#ec4899',Dinero:'#22d3ee',Crecimiento:'#f59e0b'};
const EMOJIS_H=['✅','🏃','📚','💧','🧘','💪','🥗','😴','📝','🎯','🎸','💰','❤️','🧠','✍️'];
const EMOJIS_M=['🎯','🏃','📚','💰','❤️','🧠','✈️','💻','🎸','🏠','🌍','🎓','💪','🧘','🎨'];
const HUMORES=['😣','😔','😐','😊','🤩'];

// ─── FINANZAS CONSTANTES ────────────────────────────────────────────────────
const CUENTAS=['TDC Nu','TDC Didi','Débito Nu','Débito Bakaool','Mercado Pago Crédito','Banorte','Efectivo'];
const CATS_TX=['Supermercado/Despensa','Gasolina/Transporte','Entretenimiento/Salidas','Restaurantes/Comida','Suscripciones','Servicios/Hogar','Ropa/Compras','Salud/Farmacia','Pago Préstamo','Otro'];
const PRESTAMOS=['Nu Préstamo','Didi Préstamo','Nu TDC','Mercado Pago Crédito','Didi TDC'];
const CAT_TX_COLOR={'Supermercado/Despensa':'#00d4aa','Gasolina/Transporte':'#f59e0b','Entretenimiento/Salidas':'#a78bfa','Restaurantes/Comida':'#ec4899','Suscripciones':'#6366f1','Servicios/Hogar':'#22d3ee','Ropa/Compras':'#f97316','Salud/Farmacia':'#10b981','Pago Préstamo':'#ef4444','Otro':'var(--s5)'};
const CAT_TX_EMO={'Supermercado/Despensa':'🛒','Gasolina/Transporte':'⛽','Entretenimiento/Salidas':'🎉','Restaurantes/Comida':'🍽️','Suscripciones':'📱','Servicios/Hogar':'🏠','Ropa/Compras':'👕','Salud/Farmacia':'💊','Pago Préstamo':'💸','Otro':'📦'};

// estado UI finanzas
let finTab='resumen', weekOffset=0, finTipo='gasto';

// ══ HELPERS UI ══════════════════════════════════════════════════════════════
function bar(pct,color='#00d4aa',h=6){
  pct=Math.max(0,Math.min(100,pct));
  return `<div class="bar-wrap" style="height:${h}px"><div class="bar-fill" style="width:${pct}%;background:${color};height:${h}px"></div></div>`;
}
function ring(pct,size=72,sw=6,color='#00d4aa'){
  const r=(size-sw*2)/2,c=2*Math.PI*r,d=(pct/100)*c;
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bd)" stroke-width="${sw}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
        stroke-dasharray="${d} ${c}" stroke-linecap="round"/>
    </svg>
    <div class="ring-label"><span class="ring-pct">${pct}%</span></div>
  </div>`;
}
function catBadge(cat){const col=CCAT[cat]||'var(--s6)';return `<span class="cat-badge" style="background:${col}22;color:${col};border:1px solid ${col}44">${cat}</span>`;}

// ══ RACHA ══════════════════════════════════════════════════════════════════
function calcRacha(){
  if(!state.habitos.length)return 0;
  let r=0,d=new Date();d.setDate(d.getDate()-1);
  while(true){const dia=d.toISOString().slice(0,10);if(state.habitos.some(h=>state.comp[h.id]===dia)){r++;d.setDate(d.getDate()-1);}else break;}
  if(state.habitos.some(h=>state.comp[h.id]===today()))r++;
  return r;
}

// ══ HEADER ══════════════════════════════════════════════════════════════════
function setTheme(t){document.documentElement.dataset.theme=t;lsSet('theme',t);const b=document.getElementById('theme-btn');if(b)b.textContent=t==='dark'?'☀️':'🌙';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0b1120':'#f3f5f9';}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');}
function updateHeader(){
  setTheme(document.documentElement.dataset.theme||'dark');
  const racha=calcRacha();
  document.getElementById('hdr-racha').textContent=racha;
  document.getElementById('hdr-date').textContent=new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
}

// ══ TABS ═══════════════════════════════════════════════════════════════════
let curTab='inicio';
function showTab(tab,btn){
  document.getElementById('page-'+curTab).classList.add('hidden');
  document.getElementById('page-'+tab).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');curTab=tab;renderTab(tab);
}
function renderTab(tab){
  if(tab==='inicio')renderInicio();
  else if(tab==='habitos')renderHabitos();
  else if(tab==='metas')renderMetas();
  else if(tab==='dinero')renderDinero();
  else if(tab==='diario')renderDiario();
  else if(tab==='menu')renderMenu();
}

// ══ INICIO ══════════════════════════════════════════════════════════════════
function renderInicio(){
  const{habitos,metas,comp,diario,user,txs,ingresos}=state;
  const td=today(),racha=calcRacha();
  const hComp=habitos.filter(h=>comp[h.id]===td).length;
  const hPct=habitos.length?Math.round(hComp/habitos.length*100):0;
  const mComp=metas.filter(m=>m.submetas.length&&m.submetas.every(s=>s.completado)).length;
  const mPct=metas.length?Math.round(mComp/metas.length*100):0;
  // finanzas este mes
  const mes=td.slice(0,7);
  const gastosMes=txs.filter(t=>t.tipo==='gasto'&&t.fecha.startsWith(mes)).reduce((s,t)=>s+t.monto,0);
  const ingresosMes=ingresos.filter(i=>i.fecha.startsWith(mes)).reduce((s,i)=>s+i.monto,0);
  const balance=ingresosMes-gastosMes;
  const catData=CATS_H.filter(c=>habitos.some(h=>h.categoria===c)).map(cat=>{
    const d=habitos.filter(h=>h.categoria===cat);
    return{cat,pct:d.length?Math.round(d.filter(h=>comp[h.id]===td).length/d.length*100):0};
  });
  let html=`<div class="page-title">Dashboard</div>`;
  if(user)html+=`<div class="card purple mb12"><div class="label ls15 c-purple mb4">Hola de nuevo</div><div class="f22 fw8 c-main mb6">${user.name} 👋</div>${user.vision?`<div class="f12 c-muted italic" style="line-height:1.6">"${user.vision}"</div>`:''}</div>`;
  html+=`<div class="grid2">
    <div class="card"><div class="f20 mb4">✅</div><div class="f20 fw8 c-teal">${hComp}/${habitos.length}</div><div class="f11 c-muted mb8">Hábitos hoy</div>${bar(hPct,'#00d4aa',4)}</div>
    <div class="card"><div class="f20 mb4">🎯</div><div class="f20 fw8 c-purple">${mComp}/${metas.length}</div><div class="f11 c-muted mb8">Metas logradas</div>${bar(mPct,'#6366f1',4)}</div>
    <div class="card"><div class="f20 mb4">💸</div><div class="f20 fw8 c-red">${fmt(gastosMes)}</div><div class="f11 c-muted">Gastos este mes</div></div>
    <div class="card"><div class="f20 mb4">${balance>=0?'📈':'📉'}</div><div class="f20 fw8" style="color:${balance>=0?'#00d4aa':'#ef4444'}">${fmt(balance)}</div><div class="f11 c-muted">Balance del mes</div></div>
  </div>`;
  html+=extrasInicio();
  if(catData.length){
    html+=`<div class="card mb12"><div class="label mb12">Rendimiento por área</div>
      ${catData.map(({cat,pct})=>`<div class="mb10"><div class="flex-between mb4"><span class="f13 c-mid">${cat}</span><span class="f12 fw7" style="color:${CCAT[cat]}">${pct}%</span></div>${bar(pct,CCAT[cat],5)}</div>`).join('')}
    </div>`;
  }
  html+=`<div class="card"><div class="label mb14">Visión global</div><div style="display:flex;justify-content:space-around">
    <div class="text-center">${ring(hPct,76,5,'#00d4aa')}<div class="f11 c-muted mt6">Hábitos</div></div>
    <div class="text-center">${ring(mPct,76,5,'#6366f1')}<div class="f11 c-muted mt6">Metas</div></div>
    <div class="text-center">${ring(ingresosMes?Math.min(100,Math.round(gastosMes/ingresosMes*100)):0,76,5,'#ef4444')}<div class="f11 c-muted mt6">Gasto/Ingreso</div></div>
  </div></div>`;
  document.getElementById('page-inicio').innerHTML=html;
}

// ══ HÁBITOS ═════════════════════════════════════════════════════════════════
function renderHabitos(){
  const{habitos,comp}=state;
  const td=today(),racha=calcRacha();
  const completados=habitos.filter(h=>comp[h.id]===td).length,total=habitos.length;
  const pct=total?Math.round(completados/total*100):0;
  const cats=[...new Set(habitos.map(h=>h.categoria))];
  let html=`<div class="page-title">Mis Hábitos</div>
  <div class="grid2">
    <div class="card"><div class="label">Racha</div><div class="f30 fw8 c-amber">🔥 ${racha}</div><div class="f11 c-dim">días seguidos</div></div>
    <div class="card"><div class="label">Hoy</div><div class="f30 fw8 c-teal">${pct}%</div><div class="f11 c-dim">${completados}/${total} hábitos</div></div>
  </div>
  <div class="card mb14"><div class="flex-between mb8"><span class="f13 c-sub">Progreso del día</span><span class="f13 fw7 c-teal">${completados} de ${total}</span></div>${bar(pct,'#00d4aa',10)}</div>`;
  if(!habitos.length)html+=`<div class="empty-state"><div class="es-ico">🌱</div><div class="es-t">Aún no tienes hábitos.</div></div>`;
  cats.forEach(cat=>{
    const col=CCAT[cat]||'#00d4aa';
    html+=`<div class="mb16"><div class="section-cat"><div class="cat-dot" style="background:${col}"></div><span class="section-cat-label" style="color:${col}">${cat}</span></div>`;
    habitos.filter(h=>h.categoria===cat).forEach(h=>{
      const done=comp[h.id]===td;
      html+=`<div class="habit-item${done?' done':''}" onclick="toggleHabito(${h.id})">
        <div class="check${done?' done':''}"></div>
        <span style="font-size:18px;flex-shrink:0">${h.emoji||'✅'}</span>
        <div style="flex:1"><div class="habit-name${done?' done':''}">${h.nombre}</div>${h.identidad?`<div class="habit-id">${h.identidad}</div>`:''}</div>
        <button class="btn sm" onclick="event.stopPropagation();editHabito(${h.id})" style="padding:5px 9px">✏️</button>
      </div>`;
    });
    html+='</div>';
  });
  html+=`<button class="btn" onclick="newHabito()" style="padding:13px;font-size:14px;border-radius:12px">+ Nuevo hábito</button>`;
  document.getElementById('page-habitos').innerHTML=html;
}
function toggleHabito(id){
  const td=today(),done=state.comp[id]===td;
  if(done)delete state.comp[id];else state.comp[id]=td;
  const hs=state.hist[td]||[];state.hist[td]=done?hs.filter(x=>x!==id):[...new Set([...hs,id])];save('hist');
  save('comp');updateHeader();renderHabitos();
}
function newHabito(){openHabitoModal(null);}
function editHabito(id){openHabitoModal(state.habitos.find(h=>h.id===id));}
function openHabitoModal(h){
  const isNew=!h,emSel=h?.emoji||'✅';
  document.getElementById('modal-title').textContent=isNew?'Nuevo hábito':'Editar hábito';
  document.getElementById('modal-body').innerHTML=`
    <div class="form-row"><div class="sublabel">Emoji</div>
      <div class="emoji-picker">${EMOJIS_H.map(e=>`<button class="emoji-btn${e===emSel?' sel':''}" onclick="selEmoji(this,'h-emoji')">${e}</button>`).join('')}</div>
      <input type="hidden" id="h-emoji" value="${emSel}"/></div>
    <div class="form-row"><div class="sublabel">Nombre *</div><input class="inp" id="h-nombre" value="${h?.nombre||''}" placeholder="Ej: Ejercicio 30 min"/></div>
    <div class="form-row"><div class="sublabel">Frase de identidad</div><input class="inp" id="h-identidad" value="${h?.identidad||''}" placeholder="Ej: Soy alguien activo"/></div>
    <div class="form-row"><div class="sublabel">Categoría</div>
      <select class="inp" id="h-cat">${CATS_H.map(c=>`<option${c===(h?.categoria||'Salud')?' selected':''}>${c}</option>`).join('')}</select></div>
    <div class="modal-actions">
      ${!isNew?`<button class="btn danger" onclick="deleteHabito(${h.id})" style="flex:1;padding:10px">🗑 Borrar</button>`:''}
      <button class="btn" onclick="saveHabito(${isNew?'null':h.id})" style="flex:2;padding:11px">${isNew?'Crear':'Guardar'}</button>
    </div>`;
  openModal();
}
function saveHabito(id){
  const nombre=document.getElementById('h-nombre').value.trim();if(!nombre)return;
  const data={nombre,identidad:document.getElementById('h-identidad').value.trim(),categoria:document.getElementById('h-cat').value,emoji:document.getElementById('h-emoji').value};
  if(id===null)state.habitos.push({id:nid(state.habitos),...data,creadoEn:today()});
  else state.habitos=state.habitos.map(h=>h.id===id?{...h,...data}:h);
  save('habitos');closeModal();renderHabitos();
}
function deleteHabito(id){state.habitos=state.habitos.filter(h=>h.id!==id);save('habitos');closeModal();renderHabitos();}

// ══ METAS ═══════════════════════════════════════════════════════════════════
let expandedMeta=null;
function renderMetas(){
  const{metas}=state;
  let html=`<div class="page-title">Mis Metas</div><div class="f13 c-muted mb14">${metas.length} metas · ${metas.filter(m=>m.submetas.length&&m.submetas.every(s=>s.completado)).length} completadas</div>`;
  if(!metas.length)html+=`<div class="empty-state"><div class="es-ico">🎯</div><div class="es-t">Ninguna meta todavía.</div></div>`;
  metas.forEach(meta=>{
    const comp=meta.submetas.filter(s=>s.completado).length,pct=meta.submetas.length?Math.round(comp/meta.submetas.length*100):0;
    const col=CCAT[meta.categoria]||'#00d4aa',exp=expandedMeta===meta.id;
    html+=`<div class="card mb12">
      <div class="flex gap12 mb10" style="align-items:flex-start">
        ${ring(pct,64,5,col)}
        <div style="flex:1"><div class="mb6">${catBadge(meta.categoria)}${meta.deadline?` <span class="cat-badge" style="background:var(--bd);color:var(--s5)">📅 ${meta.deadline}</span>`:''}</div>
          <div class="flex gap8" style="align-items:center"><span style="font-size:18px">${meta.emoji||'🎯'}</span><span class="f15 fw7 c-main">${meta.titulo}</span></div>
          ${meta.descripcion?`<div class="f12 c-muted mt4">${meta.descripcion}</div>`:''}</div>
        <button class="btn sm" onclick="editMeta(${meta.id})" style="padding:5px 8px;flex-shrink:0">✏️</button>
      </div>${bar(pct,col,4)}
      <button class="btn sm w100 mt10" onclick="toggleExpandMeta(${meta.id})">${exp?'▲ Ocultar pasos':`▼ Ver pasos (${comp}/${meta.submetas.length})`}</button>
      ${exp?`<div class="mt10">${meta.submetas.map(sub=>`<div class="sub-row">
        <div class="sub-check${sub.completado?' done':''}" onclick="toggleSub(${meta.id},${sub.id})"></div>
        <span class="sub-text${sub.completado?' done':''}">${sub.texto}</span>
        <button class="del-btn" onclick="delSub(${meta.id},${sub.id})">×</button>
      </div>`).join('')}
      <div class="flex gap8 mt10">
        <input class="inp" id="sub-inp-${meta.id}" placeholder="Agregar paso..." onkeydown="if(event.key==='Enter')addSub(${meta.id})"/>

function delSub(mId,sId){state.metas=state.metas.map(m=>m.id!==mId?m:{...m,submetas:m.submetas.filter(s=>s.id!==sId)});save('metas');renderMetas();}

// ─── RESUMEN ─────────────────────────────────────────────────────────────────

    <div class="label mb12">Por tarjeta / cuenta</div>
    ${Object.entries(porCuenta).sort((a,b)=>b[1]-a[1]).map(([cuenta,monto])=>`
      <div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--bd)">
        <span class="f13 c-mid">💳 ${cuenta}</span>
        <span class="f13 fw7 c-red">${fmt(monto)}</span>
      </div>`).join('') || '<div class="f13 c-muted text-center" style="padding:12px">Sin datos</div>'}
  </div>

  ${presupCard()}

// ─── SEMANA ───────────────────────────────────────────────────────────────────
function getWeekRange(offset){
  const now=new Date();
  const day=now.getDay()||7;
  const mon=new Date(now);mon.setDate(now.getDate()-day+1+offset*7);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return{start:mon.toISOString().slice(0,10),end:sun.toISOString().slice(0,10),mon,sun};
}
function renderFinSemana(){
  const{start,end,mon,sun}=getWeekRange(weekOffset);
  const txsSem=state.txs.filter(t=>t.fecha>=start&&t.fecha<=end);
  const ingSem=state.ingresos.filter(i=>i.fecha>=start&&i.fecha<=end);
  const totalG=txsSem.filter(t=>t.tipo==='gasto').reduce((s,t)=>s+t.monto,0);
  const totalI=ingSem.reduce((s,i)=>s+i.monto,0);
  const label=weekOffset===0?'Esta semana':weekOffset===-1?'Semana pasada':`${mon.toLocaleDateString('es',{day:'numeric',month:'short'})} – ${sun.toLocaleDateString('es',{day:'numeric',month:'short'})}`;
  // agrupar por día
  const porDia={};
  txsSem.filter(t=>t.tipo==='gasto').forEach(t=>{porDia[t.fecha]=(porDia[t.fecha]||0)+t.monto;});
  const all=[...txsSem,...ingSem].sort((a,b)=>b.fecha.localeCompare(a.fecha));

  let html=`
  <div class="week-nav">
    <button onclick="weekOffset--;renderDinero()">‹</button>
    <span>${label}</span>
    <button onclick="weekOffset++;renderDinero()" ${weekOffset>=0?'disabled style="opacity:.3"':''}>›</button>
  </div>
  <div class="grid2 mb12">
    <div class="card teal"><div class="label">Ingresos</div><div class="f20 fw8 c-teal">${fmt(totalI)}</div></div>
    <div class="card red"><div class="label">Gastos</div><div class="f20 fw8 c-red">${fmt(totalG)}</div></div>
  </div>`;

  // Totales por día de la semana
  const dias=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const maxDia=Math.max(...Object.values(porDia),1);
  html+=`<div class="card mb12"><div class="label mb10">Gastos por día</div><div style="display:flex;align-items:flex-end;gap:6px;height:60px">`;
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const key=d.toISOString().slice(0,10);
    const monto=porDia[key]||0;
    const h=monto?Math.max(4,Math.round(monto/maxDia*50)):2;
    const isToday=key===today();
    html+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="width:100%;background:${isToday?'#00d4aa':'#6366f1'};height:${h}px;border-radius:4px 4px 0 0;opacity:${monto?1:.2}"></div>
      <div class="f10" style="color:${isToday?'#00d4aa':'var(--s5)'}">${dias[i]}</div>
    </div>`;
  }
  html+=`</div></div>`;

  html+=`<div class="card mb12"><div class="label mb10">Movimientos</div>`;
  if(!all.length)html+=`<div class="f13 c-muted text-center" style="padding:16px">Sin movimientos esta semana</div>`;
  all.forEach(t=>{
    const esIngreso=!!t.tipo&&t.tipo!=='gasto';
    const cat=t.categoria||t.tipo_ingreso||'Ingreso';
    const col=esIngreso?'#00d4aa':'#ef4444';
    const emo=esIngreso?'💵':(CAT_TX_EMO[cat]||'📦');
    html+=`<div class="tx-item">
      <div class="tx-ico" style="background:${(CAT_TX_COLOR[cat]||'var(--s5)')}22">${emo}</div>
      <div class="tx-info">
        <div class="tx-name">${t.nota||cat}</div>
        <div class="tx-meta">${t.cuenta||''} · ${new Date(t.fecha+'T12:00:00').toLocaleDateString('es',{weekday:'short',day:'numeric'})}</div>
      </div>
      <div>
        <div class="tx-amount ${esIngreso?'ingreso':'gasto'}">${esIngreso?'+':'-'}${fmt(t.monto)}</div>
        <button class="del-btn" onclick="${esIngreso?`deleteIngreso(${t.id})`:`deleteTx(${t.id})`}" style="float:right;color:var(--s4)">×</button>
      </div>
    </div>`;
  });
  html+=`</div>
  <button class="btn" onclick="openNuevaTx()" style="padding:12px;font-size:13px;border-radius:12px;margin-bottom:8px">+ Gasto</button>
  <button class="btn purple" onclick="openNuevoIngreso()" style="padding:11px;font-size:13px;border-radius:12px">+ Ingreso</button>`;
  return html;
}

function saveDeuda(id){

function renderFinIngresos(){

let expandedEntry=null,diarioHumor=3,diarioFoto=null,diarioDraft='';
function escH(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function keepDraft(){const t=document.getElementById('diario-txt');if(t)diarioDraft=t.value;}
function renderDiario(){
  const{diario}=state;
  let html=`<div class="page-title">Diario Personal</div>
  <div class="card mb14">
    <div class="sublabel">¿Cómo te sientes hoy?</div>
    <div class="humor-row">${HUMORES.map((h,i)=>`<button class="humor-btn${diarioHumor===i+1?' sel':''}" onclick="setHumor(${i+1})">${h}</button>`).join('')}</div>
    <textarea class="inp mb10" id="diario-txt" rows="4" placeholder="¿Qué pasó hoy? ¿Qué aprendiste? ¿Qué agradeces?...">${escH(diarioDraft)}</textarea>
    ${diarioFoto?`<div class="dia-prev mb10"><img src="${diarioFoto}" alt="Foto del día"/><button class="dia-x" onclick="quitarFoto()" aria-label="Quitar foto">×</button></div>`:`<div class="flex gap8 mb10"><label class="btn sm dia-add">📷 Tomar foto<input type="file" accept="image/*" capture="environment" onchange="pickFoto(this)" hidden/></label><label class="btn sm dia-add">🖼️ Galería<input type="file" accept="image/*" onchange="pickFoto(this)" hidden/></label></div>`}
    <button class="btn" onclick="guardarEntrada()">Guardar entrada</button>
  </div>`;
  if(!diario.length)html+=`<div class="empty-state"><div class="es-ico">📓</div><div class="es-t">Tu diario está vacío.</div></div>`;
  diario.forEach(e=>{
    const exp=expandedEntry===e.id;
    html+=`<div class="card mb10" onclick="toggleEntry(${e.id})" style="cursor:pointer">
      <div class="flex-between">
        <div class="flex gap8" style="align-items:center"><span style="font-size:18px">${HUMORES[e.humor-1]}</span><span class="f12 c-muted">${new Date(e.fecha+'T12:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</span></div>
        <div class="flex gap6"><span class="f13 c-dim">${exp?'▲':'▼'}</span><button class="del-btn" onclick="event.stopPropagation();deleteEntrada(${e.id})" style="font-size:16px">×</button></div>
      </div>
      ${exp?`${e.foto?`<img class="dia-img" src="${e.foto}" alt="Foto del día"/>`:''}${e.texto?`<div class="entry-body">${e.texto}</div>`:''}`:`<div class="flex gap10" style="align-items:center;margin-top:6px">${e.foto?`<img class="dia-thumb" src="${e.foto}" alt=""/>`:''}<div class="entry-preview" style="margin-top:0;min-width:0">${e.texto||'📷 Foto'}</div></div>`}
    </div>`;
  });
  document.getElementById('page-diario').innerHTML=html;
}
function setHumor(n){keepDraft();diarioHumor=n;renderDiario();}
function quitarFoto(){keepDraft();diarioFoto=null;renderDiario();}
function pickFoto(inp){
  const f=inp.files[0];if(!f)return;keepDraft();
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    diarioFoto=c.toDataURL('image/jpeg',.72);renderDiario();};
    im.src=rd.result;};
  rd.readAsDataURL(f);
}
function toggleEntry(id){expandedEntry=expandedEntry===id?null:id;renderDiario();}
function guardarEntrada(){
  const txt=document.getElementById('diario-txt').value.trim();if(!txt&&!diarioFoto)return;
  const en={id:nid(state.diario),fecha:today(),texto:txt,humor:diarioHumor,ts:Date.now()};
  if(diarioFoto)en.foto=diarioFoto;
  state.diario.unshift(en);
  try{localStorage.setItem(KEY+'diario',JSON.stringify(state.diario));}
  catch(e){state.diario.shift();diarioDraft=txt;alert('No hay espacio para guardar esta foto. Borra fotos de entradas anteriores o guarda la entrada sin foto.');renderDiario();return;}
  diarioFoto=null;diarioDraft='';renderDiario();
}
function deleteEntrada(id){state.diario=state.diario.filter(e=>e.id!==id);save('diario');if(expandedEntry===id)expandedEntry=null;renderDiario();}

    h+='</div>';
  });
  return h+`<div class="f12 c-muted" style="line-height:1.6;padding:0 4px 8px">Las colaciones son solo si hay apetito. Porciones por persona, para 2 personas. 3 L de agua al día, sin líquidos junto con la comida (30–60 min antes o después). Máximo 2 tortillas de maíz al día.</div>`;
}
function lista(w){
  const m=state.menu;m.lst=m.lst||{};
  if(!m.lst[w])m.lst[w]=Object.entries(COMPRAS[w-1]).map(([c,s])=>({c,items:s.split('|').map(t=>({t,ok:false}))}));
  return m.lst[w];
}
function menuCompras(w){
  const L=lista(w);let tot=0,ok=0;
  L.forEach(g=>g.items.forEach(i=>{tot++;if(i.ok)ok++;}));
  let h=`<div class="card teal"><div class="flex-between mb8"><span class="f13 fw7 c-main">Semana ${w}</span><span class="f12 c-teal fw7">${ok} de ${tot}</span></div>${bar(tot?ok/tot*100:0)}</div>`;
  L.forEach((g,gi)=>{
    h+=`<div class="card"><div class="flex-between mb6"><span class="f13 fw7 c-teal">${escH(g.c)}</span><button class="del-btn" onclick="delCat(${w},${gi})" aria-label="Quitar categoría">🗑</button></div>`;
    g.items.forEach((it,ii)=>{
      h+=`<div class="mn-item${it.ok?' done':''}"><div class="check${it.ok?' done':''}" onclick="toggleCompra(${w},${gi},${ii})"></div><span style="flex:1" onclick="toggleCompra(${w},${gi},${ii})">${escH(it.t)}</span><button class="del-btn" onclick="editCompra(${w},${gi},${ii})" aria-label="Editar">✎</button><button class="del-btn" onclick="delCompra(${w},${gi},${ii})" aria-label="Quitar">×</button></div>`;
    });
    h+=`<div class="mn-add"><input class="inp" id="add-${gi}" placeholder="Añadir artículo…" onkeydown="if(event.key==='Enter')addCompra(${w},${gi})"/><button class="btn sm" onclick="addCompra(${w},${gi})">＋</button></div></div>`;
  });
  return h+`<div class="flex gap8 mb10"><button class="btn sm" style="flex:1" onclick="addCat(${w})">＋ Categoría</button><button class="btn sm" style="flex:1" onclick="resetCompras(${w})">Desmarcar todo</button></div><button class="btn" style="width:100%;margin-bottom:8px" onclick="registrarCompra(${w})">🛒 Registrar gasto en Dinero</button><button class="btn sm" style="width:100%" onclick="restaurarLista(${w})">Restaurar lista original</button>`;
}
function saveMenu(){save('menu');renderMenu();}
function toggleCompra(w,g,i){const it=lista(w)[g].items[i];it.ok=!it.ok;saveMenu();}
function addCompra(w,g){const t=document.getElementById('add-'+g).value.trim();if(!t)return;lista(w)[g].items.push({t,ok:false});saveMenu();}
function editCompra(w,g,i){const it=lista(w)[g].items[i],t=prompt('Editar artículo',it.t);if(t&&t.trim()){it.t=t.trim();saveMenu();}}
function delCompra(w,g,i){lista(w)[g].items.splice(i,1);saveMenu();}
function addCat(w){const c=prompt('Nombre de la categoría');if(c&&c.trim()){lista(w).push({c:c.trim(),items:[]});saveMenu();}}
function delCat(w,g){if(confirm('¿Quitar esta categoría y sus artículos?')){lista(w).splice(g,1);saveMenu();}}
function resetCompras(w){lista(w).forEach(g=>g.items.forEach(i=>i.ok=false));saveMenu();}
function restaurarLista(w){if(confirm('¿Volver a la lista original de la semana '+w+'? Se pierden tus cambios.')){delete state.menu.lst[w];saveMenu();}}

// ══ EXTRAS: HOY, AGUA, RESUMEN, PRESUPUESTO ═════════════════════════════════
const AGUA_META=12; // vasos de 250 ml = 3 L
function diasAtras(n){return new Date(Date.now()-n*864e5).toISOString().slice(0,10);}
function gastoPorCat(){const mes=today().slice(0,7),o={};state.txs.filter(t=>t.tipo==='gasto'&&t.fecha.startsWith(mes)).forEach(t=>{o[t.categoria]=(o[t.categoria]||0)+t.monto;});return o;}
function extrasInicio(){
  const td=today(),m=state.menu,hy=m.hoy||{sem:1,dia:1},dia=MENU[hy.sem-1][hy.dia-1];
  let h=`<div class="card teal"><div class="flex-between mb8"><span class="f14 fw7 c-main">🍽️ Hoy toca</span><div class="flex gap6" style="align-items:center"><button class="btn sm" onclick="hoyMove(-1)">◀</button><span class="f12 c-teal fw7">Sem ${hy.sem} · Día ${hy.dia}</span><button class="btn sm" onclick="hoyMove(1)">▶</button></div></div>`;
  dia.forEach((x,j)=>{h+=`<div class="mn-row${j%2?' snack':''}"><div class="mn-l">${MN_L[j]}</div><div class="mn-n">${(MN_R[x]||x).split('|')[0]}</div></div>`;});
  h+='</div>';
  const n=state.agua[td]||0;
  h+=`<div class="card"><div class="flex-between mb8"><span class="f14 fw7 c-main">💧 Agua</span><span class="f12 c-cyan fw7">${(n*.25).toFixed(2).replace(/\.?0+$/,'')} L de 3 L</span></div><div class="agua">${Array.from({length:AGUA_META},(_,i)=>`<button class="vaso${i<n?' on':''}" onclick="aguaSet(${i+1})" aria-label="Vaso ${i+1}">💧</button>`).join('')}</div></div>`;
  const pc=gastoPorCat(),av=Object.entries(state.presup).filter(([c,l])=>l>0&&(pc[c]||0)/l>=.8);
  av.forEach(([c,l])=>{const p=Math.round((pc[c]||0)/l*100);h+=`<div class="card red"><div class="f13 c-red fw7">⚠️ ${c}: ${p>=100?'te pasaste del límite':'vas al '+p+'% del límite'}</div><div class="f12 c-muted mt4">${fmt(pc[c])} de ${fmt(l)} este mes</div></div>`;});
  const ds=Array.from({length:7},(_,i)=>diasAtras(i));
  const gasto=state.txs.filter(t=>t.tipo==='gasto'&&ds.includes(t.fecha)).reduce((s,t)=>s+t.monto,0);
  const hc=ds.reduce((s,d)=>s+((state.hist[d]||[]).length),0),hp=state.habitos.length?Math.round(hc/(state.habitos.length*7)*100):0;
  const en=state.diario.filter(e=>ds.includes(e.fecha)),an=en.length?HUMORES[Math.round(en.reduce((s,e)=>s+e.humor,0)/en.length)-1]:'—';
  h+=`<div class="card purple"><div class="f14 fw7 c-main mb10">📅 Últimos 7 días</div><div class="grid3" style="margin-bottom:0"><div class="text-center"><div class="f20 fw8 c-teal">${hp}%</div><div class="f11 c-muted">Hábitos</div></div><div class="text-center"><div class="f20 fw8 c-red">${fmt(gasto)}</div><div class="f11 c-muted">Gastado</div></div><div class="text-center"><div class="f20">${an}</div><div class="f11 c-muted">Ánimo (${en.length})</div></div></div></div>`;
  return h;
}
function hoyMove(d){const m=state.menu,hy=m.hoy||{sem:1,dia:1},i=((hy.sem-1)*5+hy.dia-1+d+20)%20;m.hoy={sem:Math.floor(i/5)+1,dia:i%5+1};save('menu');renderInicio();}
function aguaSet(k){const td=today();state.agua[td]=(state.agua[td]===k)?k-1:k;save('agua');renderInicio();}
function presupCard(){
  const pc=gastoPorCat();
  return `<div class="card mb12"><div class="label mb4">Límites mensuales</div><div class="f11 c-muted mb10">Escribe un tope por categoría. Te avisamos al llegar al 80%.</div>${CATS_TX.map((c,i)=>{
    const l=state.presup[c]||0,g=pc[c]||0,p=l?Math.round(g/l*100):0,col=p>=100?'#ef4444':p>=80?'#f59e0b':'#00d4aa';
    return `<div class="mb10"><div class="flex-between mb4"><span class="f13 c-mid">${CAT_TX_EMO[c]} ${c}</span><input class="inp pr-inp" type="number" inputmode="decimal" min="0" placeholder="Sin límite" value="${l||''}" onchange="setPresup(${i},this.value)"/></div>${l?`${bar(p,col,5)}<div class="f11 mt4" style="color:${col}">${fmt(g)} de ${fmt(l)} · ${p}%</div>`:''}</div>`;}).join('')}</div>`;
}
function setPresup(i,v){const c=CATS_TX[i],n=parseFloat(v);if(n>0)state.presup[c]=n;else delete state.presup[c];save('presup');renderDinero();}
function registrarCompra(w){
  const v=prompt('¿Cuánto gastaste en las compras de la semana '+w+'? (se registra en Supermercado/Despensa, cuenta Efectivo)');
  const monto=parseFloat(v);if(!monto||monto<=0)return;
  state.txs.push({id:nid(state.txs),tipo:'gasto',categoria:'Supermercado/Despensa',cuenta:'Efectivo',monto,nota:'Compras semana '+w,fecha:today()});
  save('txs');alert('Gasto de '+fmt(monto)+' registrado en Dinero.');
}

// ══ MODAL ═══════════════════════════════════════════════════════════════════
function openModal(){document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function selEmoji(btn,hid){btn.closest('.emoji-picker').querySelectorAll('.emoji-btn').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');document.getElementById(hid).value=btn.textContent;}

// ══ FOCUS ═══════════════════════════════════════════════════════════════════
let focusMins=25,focusSecs=0,focusRunning=false,focusInterval=null,focusTotalSecs=1500;
function openFocus(){document.getElementById('focus-mode').classList.remove('hidden');renderFocusTime();}
function closeFocus(){document.getElementById('focus-mode').classList.add('hidden');clearInterval(focusInterval);focusRunning=false;updateFocusBtn();}
function focusSet(m){clearInterval(focusInterval);focusRunning=false;focusMins=m;focusSecs=0;focusTotalSecs=m*60;renderFocusTime();updateFocusBtn();}
function focusToggle(){
  if(focusRunning){clearInterval(focusInterval);focusRunning=false;}
  else{focusRunning=true;focusInterval=setInterval(()=>{
    if(focusSecs===0){if(focusMins===0){clearInterval(focusInterval);focusRunning=false;document.getElementById('focus-done').classList.remove('hidden');return;}focusMins--;focusSecs=59;}else focusSecs--;
    renderFocusTime();updateFocusBtn();
  },1000);}
  updateFocusBtn();
}
function focusReset(){clearInterval(focusInterval);focusRunning=false;focusMins=25;focusSecs=0;focusTotalSecs=1500;document.getElementById('focus-done').classList.add('hidden');renderFocusTime();updateFocusBtn();}
function focusAgain(){document.getElementById('focus-done').classList.add('hidden');focusReset();}
function updateFocusBtn(){const b=document.getElementById('focus-play-btn');if(b)b.textContent=focusRunning?'⏸ Pausar':'▶ Iniciar';}
function renderFocusTime(){
  document.getElementById('focus-time').textContent=`${String(focusMins).padStart(2,'0')}:${String(focusSecs).padStart(2,'0')}`;
  const elapsed=focusTotalSecs-(focusMins*60+focusSecs),pct=focusTotalSecs?elapsed/focusTotalSecs:0;
  const circ=document.getElementById('focus-circle');
  if(circ){const r=88,c=2*Math.PI*r,d=pct*c;circ.setAttribute('stroke-dasharray',`${d} ${c}`);}
}

// ══ ONBOARDING ══════════════════════════════════════════════════════════════
let obGoals=[],obCurStep=0;
function obStep(n){
  if(n===2&&!document.getElementById('ob-name').value.trim())return;
  document.getElementById('ob-s'+obCurStep).classList.remove('active');
  obCurStep=n;
  document.getElementById('ob-s'+n).classList.add('active');
  [1,2,3].forEach(i=>document.getElementById('ob-b'+i).classList.toggle('active',i<=n));
}
function toggleGoal(btn,goal){btn.classList.toggle('sel');obGoals=obGoals.includes(goal)?obGoals.filter(g=>g!==goal):[...obGoals,goal];}
function obFinish(){
  const name=document.getElementById('ob-name').value.trim();
  const vision=document.getElementById('ob-vision').value.trim();
  if(!vision)return;
  state.user={name,goals:obGoals,vision};save('user');
  const ini=[];
  if(obGoals.includes('Ponerme en forma')){ini.push({id:nid(ini),nombre:'Ejercicio 30 min',identidad:'Soy alguien activo y fuerte',categoria:'Salud',emoji:'🏃',creadoEn:today()});ini.push({id:nid(ini),nombre:'Beber 2L de agua',identidad:'Cuido mi cuerpo cada día',categoria:'Salud',emoji:'💧',creadoEn:today()});}
  if(obGoals.includes('Aprender algo nuevo'))ini.push({id:nid(ini),nombre:'Leer 20 min',identidad:'Soy alguien que aprende cada día',categoria:'Crecimiento',emoji:'📚',creadoEn:today()});
  if(obGoals.includes('Reducir el estrés'))ini.push({id:nid(ini),nombre:'Meditación 10 min',identidad:'Cuido mi paz mental',categoria:'Mente',emoji:'🧘',creadoEn:today()});
  if(obGoals.includes('Mejorar relaciones'))ini.push({id:nid(ini),nombre:'Mensaje a alguien querido',identidad:'Nutro mis vínculos',categoria:'Relaciones',emoji:'❤️',creadoEn:today()});
  if(obGoals.includes('Mejorar mis finanzas'))ini.push({id:nid(ini),nombre:'Registrar gastos del día',identidad:'Soy consciente con el dinero',categoria:'Dinero',emoji:'💰',creadoEn:today()});
  if(!ini.length)ini.push({id:1,nombre:'Mi primer hábito',identidad:'Soy alguien que crece cada día',categoria:'Crecimiento',emoji:'🌱',creadoEn:today()});
  state.habitos=ini;save('habitos');
  document.getElementById('onboarding').style.display='none';
  document.getElementById('app').classList.remove('hidden');
  initApp();
}

// ══ INIT ════════════════════════════════════════════════════════════════════
function initApp(){updateHeader();renderInicio();}
window.onload=()=>{
  if(state.user){document.getElementById('onboarding').style.display='none';document.getElementById('app').classList.remove('hidden');initApp();}
};
// helpers css
document.head.insertAdjacentHTML('beforeend',`<style>.f18{font-size:18px}.mb20{margin-bottom:20px}.c-red{color:#ef4444}</style>`);
// ══ SELECTOR PERSONALIZADO ══════════════════════════════════════════════════
(function(){
  const chev='<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="var(--s5)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>';
  function close(){const o=document.getElementById('cs-sheet');if(o)o.remove();document.removeEventListener('keydown',esc);}
  function esc(e){if(e.key==='Escape')close();}
  function openSheet(sel,sync){
    close();
    const bg=document.createElement('div');bg.id='cs-sheet';bg.className='cs-bg';bg.onclick=close;
    const box=document.createElement('div');box.className='cs-box';box.onclick=e=>e.stopPropagation();
    const grab=document.createElement('div');grab.className='cs-grab';box.appendChild(grab);
    const lab=sel.closest('.form-row')&&sel.closest('.form-row').querySelector('.label,.sublabel');
    if(lab){const t=document.createElement('div');t.className='cs-title';t.textContent=lab.textContent;box.appendChild(t);}
    const list=document.createElement('div');list.className='cs-list';
    Array.from(sel.options).forEach((op,i)=>{
      const r=document.createElement('button');r.type='button';
      r.className='cs-opt'+(i===sel.selectedIndex?' sel':'');
      const s=document.createElement('span');s.textContent=op.text;r.appendChild(s);
      const c=document.createElement('i');r.appendChild(c);
      r.onclick=()=>{sel.selectedIndex=i;sel.dispatchEvent(new Event('change',{bubbles:true}));sync();close();};
      list.appendChild(r);
    });
    box.appendChild(list);bg.appendChild(box);document.body.appendChild(bg);
    document.addEventListener('keydown',esc);
    const cur=list.querySelector('.sel');if(cur)cur.scrollIntoView({block:'center'});
  }
  function upgrade(sel){
    sel.dataset.cs='1';sel.style.display='none';
    const b=document.createElement('button');b.type='button';b.className='inp cs-btn';
    const sync=()=>{const o=sel.options[sel.selectedIndex];b.innerHTML='';const s=document.createElement('span');s.textContent=o?o.text:'';b.appendChild(s);b.insertAdjacentHTML('beforeend',chev);};
    sync();sel.after(b);b.onclick=()=>openSheet(sel,sync);
  }
  const run=()=>document.querySelectorAll('select.inp:not([data-cs])').forEach(upgrade);
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true});run();
})();

</script>
